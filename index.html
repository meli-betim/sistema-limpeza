  // Breakdown por prioridade no período
  const altaPer=allPeriod.filter(r=>r.prio==='alta');
  const altaConPer=altaPer.filter(r=>r.status==='concluida');
  const normPer=allPeriod.filter(r=>r.prio!=='alta');
  const normConPer=normPer.filter(r=>r.status==='concluida');
  html+=`
    <div class="section-title">Por prioridade no período</div>
    <div class="turn-breakdown">
      <div class="turn-mini">
        <div class="tlabel" style="color:var(--bad);">Urgentes</div>
        <div class="mini-track"><div class="mini-fill ${altaPer.length&&Math.round(altaConPer.length/altaPer.length*100)<95?'warn':''}" style="width:${altaPer.length?Math.round(altaConPer.length/altaPer.length*100):0}%"></div></div>
        <div class="tpct">${altaConPer.length} concluídas de ${altaPer.length} — ${altaPer.length?Math.round(altaConPer.length/altaPer.length*100):0}%</div>
      </div>
      <div class="turn-mini">
        <div class="tlabel" style="color:var(--text-dim);">Prioridade normal</div>
        <div class="mini-track"><div class="mini-fill" style="width:${normPer.length?Math.round(normConPer.length/normPer.length*100):0}%"></div></div>
        <div class="tpct">${normConPer.length} concluídas de ${normPer.length} — ${normPer.length?Math.round(normConPer.length/normPer.length*100):0}%</div>
      </div>
    </div>`;

  // Tabela do período: concluídas primeiro, depois pendentes
  if(allPeriod.length){
    const conOrdenadas=conPer.sort((a,b)=>(b.closedAt||0)-(a.closedAt||0));
    const naoResOrdenadas=naoResPer.sort((a,b)=>a.createdAt-b.createdAt);
    html+=`<div class="section-title">Atendidos no período (${conPer.length})</div>`;
    if(conOrdenadas.length){
      html+=tableHead+conOrdenadas.map(reqRow).join('')+`</tbody></table></div>`;
    } else {
      html+=`<div class="empty-state">Nenhuma solicitação concluída neste período.</div>`;
    }
    html+=`<div class="section-title" style="margin-top:18px;">Não resolvidos no período (${naoResPer.length})</div>`;
    if(naoResOrdenadas.length){
      html+=tableHead+naoResOrdenadas.map(reqRow).join('')+`</tbody></table></div>`;
    } else {
      html+=`<div class="empty-state">Todos os chamados do período foram resolvidos 🎉</div>`;
    }
  } else {
    html+=`<div class="empty-state">Nenhuma solicitação registrada no período selecionado.</div>`;
  }

  html+=`<div id="reqFilterResults"></div>`;

  content.innerHTML=html;

  // Wire filters
  document.getElementById('reqFilterApply')?.addEventListener('click', ()=>{
    const fMonth = document.getElementById('reqFilterMonth').value;
    const fTipo  = document.getElementById('reqFilterTipo').value;
    const fPrio  = document.getElementById('reqFilterPrio').value;

    // Se nenhum filtro selecionado, não faz nada
    if(!fMonth && !fTipo && !fPrio) return;

    let filtered = all;
    if(fMonth){ const [y,mo]=fMonth.split('-'); filtered=filtered.filter(r=>{ const d=new Date(r.createdAt); return d.getFullYear()==y&&(d.getMonth()+1)==mo; }); }
    if(fTipo)  filtered=filtered.filter(r=>(r.tipo||'Não informado')===fTipo);
    if(fPrio)  filtered=filtered.filter(r=>r.prio===fPrio);

    const conF=filtered.filter(r=>r.status==='concluida');
    const aberF=filtered.filter(r=>r.status==='aberta');
    const andF=filtered.filter(r=>r.status==='andamento');
    const slaF=calcSla(conF);
    const txF=filtered.length?Math.round(conF.length/filtered.length*100):0;

    // Breakdown por tipo
    const tiposF={};
    filtered.forEach(r=>{ const t=r.tipo||'Não informado'; tiposF[t]=(tiposF[t]||0)+1; });
    const tipoBreakdown=Object.entries(tiposF).sort((a,b)=>b[1]-a[1]).map(([tipo,qtd])=>{
      const pct=filtered.length?Math.round(qtd/filtered.length*100):0;
      const conTipo=conF.filter(r=>(r.tipo||'Não informado')===tipo).length;
      return `<div class="stat-box">
        <div class="num" style="font-size:20px;color:var(--teal-bright);">${qtd}</div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:4px;font-weight:600;">${tipo}</div>
        <div style="font-size:11px;color:var(--ok);margin-top:2px;">${conTipo} concluídas</div>
        <div style="margin-top:6px;height:4px;background:var(--panel-2);border-radius:3px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:var(--teal);border-radius:3px;"></div>
        </div>
        <div style="font-size:10px;color:var(--text-dim);margin-top:3px;">${pct}% do filtro</div>
      </div>`;
    }).join('');

    // Descrição dos filtros ativos
    const filtrosAtivos = [
      fMonth ? `Mês: ${fMonth}` : '',
      fTipo  ? `Tipo: ${fTipo}` : '',
      fPrio  ? `Prioridade: ${fPrio==='alta'?'Urgente':'Normal'}` : '',
    ].filter(Boolean).join(' · ');

    // Substituir TODA a tela com o resultado filtrado
    content.innerHTML=`
      <!-- Barra de filtros ativa -->
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;background:var(--panel);border:1px solid var(--teal);border-radius:10px;padding:14px 18px;">
        <div style="font-size:13px;color:var(--teal-bright);font-weight:600;">🔍 Filtro ativo:</div>
        <div style="font-size:13px;color:var(--text);">${filtrosAtivos}</div>
        <button id="reqFilterClearResult" class="btn secondary" style="margin-left:auto;">✕ Limpar filtro</button>
      </div>

      <!-- KPIs do filtro -->
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${filtered.length}</div><div class="lbl">Total</div></div>
        <div class="stat-box"><div class="num" style="color:var(--amber)">${aberF.length+andF.length}</div><div class="lbl">Não resolvidas</div></div>
        <div class="stat-box"><div class="num" style="color:var(--ok)">${conF.length}</div><div class="lbl">Concluídas</div></div>
        <div class="stat-box"><div class="num" style="color:${txF>=80?'var(--ok)':'var(--bad)'};">${txF}%</div><div class="lbl">Taxa resolução</div></div>
        <div class="stat-box"><div class="num" style="color:var(--teal-bright)">${slaF||'—'}</div><div class="lbl">SLA médio</div></div>
      </div>

      <!-- Breakdown por tipo (só se houver mais de 1) -->
      ${Object.keys(tiposF).length>1?`<div class="section-title">Por tipo de ocorrência</div><div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">${tipoBreakdown}</div>`:''}

      <!-- Tabela de chamados -->
      <div class="section-title">Chamados (${filtered.length})</div>
      ${filtered.length
        ? tableHead+filtered.sort((a,b)=>b.createdAt-a.createdAt).map(reqRow).join('')+'</tbody></table></div>'
        : '<div class="empty-state">Nenhum resultado para os filtros selecionados.</div>'
      }
    `;

    // Botão limpar volta para a tela completa
    document.getElementById('reqFilterClearResult')?.addEventListener('click', ()=>{
      renderReportRequests(content);
    });
  });
}

// Campo de busca acima do select — filtra opções em tempo real
function makeSearchableSelect(selectId){
  const sel = document.getElementById(selectId);
  if(!sel || sel._searchable) return;
  sel._searchable = true;
  sel.style.display = 'none';

  const allItems = Array.from(sel.options).map(o=>({value:o.value, text:o.text}));

  // Build wrapper
  const wrap = document.createElement('div');
  wrap.className = 'loc-ac-wrap';
  sel.parentNode.insertBefore(wrap, sel);
  wrap.appendChild(sel);

  // Input
  const input = document.createElement('input');
  input.type = 'text';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.placeholder = '🔍  Buscar local...';
  input.className = 'loc-ac-input';
  const curOpt = allItems.find(i=>i.value===sel.value);
  if(curOpt) input.value = curOpt.text;
  wrap.insertBefore(input, sel);

  // Chevron
  const icon = document.createElement('span');
  icon.className = 'loc-ac-icon';
  icon.textContent = '⌄';
  wrap.insertBefore(icon, sel);

  // Dropdown
  const dd = document.createElement('div');
  dd.className = 'loc-ac-dropdown';
  wrap.insertBefore(dd, sel);

  let hi = -1;

  function getFiltered(q){
    return q ? allItems.filter(i=>i.text.toLowerCase().includes(q.toLowerCase())) : allItems;
  }

  function renderDD(q){
    const f = getFiltered(q);
    hi = f.length===1 ? 0 : -1;
    dd.innerHTML = '';
    if(!f.length){
      dd.innerHTML = '<div class="loc-ac-empty">Nenhum ambiente encontrado</div>';
      return;
    }
    f.forEach((item,idx)=>{
      const div = document.createElement('div');
      div.className = 'loc-ac-item' + (idx===hi?' highlighted':'');
      div.textContent = item.text;
      div.addEventListener('mousedown', e=>{
        e.preventDefault();
        pickItem(item);
      });
      // Touch support
      div.addEventListener('touchend', e=>{
        e.preventDefault();
        pickItem(item);
      });
      dd.appendChild(div);
    });
  }

  function pickItem(item){
    sel.value = item.value;
    input.value = item.text;
    dd.classList.remove('open');
    icon.textContent = '⌄';
    sel.dispatchEvent(new Event('change', {bubbles:true}));
    input.blur();
  }

  function openDD(){
    renderDD(input.value);
    dd.classList.add('open');
    icon.textContent = '⌃';
  }

  function closeDD(){
    dd.classList.remove('open');
    icon.textContent = '⌄';
    // Restore label
    const cur = allItems.find(i=>i.value===sel.value);
    if(cur) input.value = cur.text;
  }

  input.addEventListener('focus', ()=>{ input.select(); openDD(); });
  input.addEventListener('input', ()=>{ openDD(); const f=getFiltered(input.value); if(f.length===1) sel.value=f[0].value; });
  input.addEventListener('blur',  ()=>{ setTimeout(closeDD, 250); });

  input.addEventListener('keydown', e=>{
    const f = getFiltered(input.value);
    if(e.key==='ArrowDown'){ e.preventDefault(); hi=Math.min(hi+1,f.length-1); updateHi(f); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); hi=Math.max(hi-1,0); updateHi(f); }
    else if(e.key==='Enter'){ e.preventDefault(); if(hi>=0&&f[hi]) pickItem(f[hi]); else if(f.length===1) pickItem(f[0]); }
    else if(e.key==='Escape'){ input.value=''; openDD(); }
  });

  function updateHi(f){
    dd.querySelectorAll('.loc-ac-item').forEach((el,i)=>{
      el.classList.toggle('highlighted', i===hi);
      if(i===hi) el.scrollIntoView({block:'nearest'});
    });
    if(hi>=0&&f[hi]) sel.value=f[hi].value;
  }

  document.addEventListener('click', e=>{ if(!wrap.contains(e.target)) closeDD(); });
}

/* ===================== GESTÃO DE USUÁRIOS ===================== */
async function renderUsers(){
  if(!isAdmin){ renderChecklist(); return; }
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Carregando usuários...</div>';
  let users = [];
  try{ const snap=await window.storage.get('system:users',true); users=snap?JSON.parse(snap.value):[]; }catch(e){ users=[]; }
  const sorted=[...users].sort((a,b)=>a.nome.localeCompare(b.nome));
  const admins=sorted.filter(u=>u.perfil==='admin');
  const ops=sorted.filter(u=>u.perfil!=='admin');
  function userRow(u){
    const ri=users.findIndex(x=>x.nome===u.nome); const isAdm=u.perfil==='admin';
    return `<tr style="border-bottom:1px solid var(--line);">
      <td style="padding:11px 16px;"><div style="display:flex;align-items:center;gap:10px;">
        <div style="width:32px;height:32px;border-radius:50%;background:${isAdm?'#e3b341':'var(--teal)'};color:${isAdm?'#000':'#fff'};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;">${u.nome.charAt(0).toUpperCase()}</div>
        <div style="font-size:13px;font-weight:600;">${u.nome}</div>
      </div></td>
      <td style="padding:11px 16px;"><span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;${isAdm?'background:rgba(227,179,65,.15);color:#e3b341;':'background:rgba(31,138,140,.12);color:var(--teal-bright);'}">${isAdm?'👑 Admin':'👤 Operador'}</span></td>
      <td style="padding:11px 16px;"><span style="font-size:12px;color:var(--text-dim);background:var(--panel-2);padding:3px 10px;border-radius:6px;letter-spacing:1px;">••••</span></td>
      <td style="padding:11px 16px;text-align:right;white-space:nowrap;">
        <button class="btn small secondary" data-editperfil="${ri}" style="margin-right:6px;" title="Alterar perfil">👤</button>
        <button class="btn small secondary" data-edit="${ri}" style="margin-right:6px;" title="Alterar PIN">🔑</button>
        <button class="btn small secondary" style="color:var(--bad);border-color:var(--bad);" data-del="${ri}" title="Excluir">✕</button>
      </td></tr>`;
  }
  function tbl(list,title,color){
    if(!list.length) return '';
    return `<div style="font-size:11px;font-weight:700;color:${color};text-transform:uppercase;letter-spacing:.8px;margin:20px 0 8px;">${title} (${list.length})</div>
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:4px;">
      <table style="width:100%;border-collapse:collapse;">
        <thead><tr style="border-bottom:1px solid var(--line);background:var(--panel-2);">
          <th style="padding:9px 16px;text-align:left;font-size:11px;color:var(--text-dim);">NOME</th>
          <th style="padding:9px 16px;text-align:left;font-size:11px;color:var(--text-dim);">PERFIL</th>
          <th style="padding:9px 16px;text-align:left;font-size:11px;color:var(--text-dim);">PIN</th>
          <th style="padding:9px 16px;text-align:right;font-size:11px;color:var(--text-dim);">AÇÕES</th>
        </tr></thead>
        <tbody>${list.map(userRow).join('')}</tbody>
      </table>
    </div>`;
  }
  app.innerHTML=`<div style="max-width:700px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
      <div><div style="font-size:18px;font-weight:700;">👥 Usuários</div>
      <div style="font-size:13px;color:var(--text-dim);margin-top:2px;">${users.length} usuário${users.length!==1?'s':''} · ${admins.length} admin · ${ops.length} operador${ops.length!==1?'es':''}</div></div>
      <button class="btn" id="btnShowForm">+ Novo usuário</button>
    </div>
    <div class="card" id="formCard" style="margin-bottom:20px;display:none;">
      <div style="font-size:14px;font-weight:600;margin-bottom:14px;">+ Novo usuário</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div style="flex:3;min-width:160px;"><label class="lbl-base">NOME</label><input type="text" id="uNome" placeholder="Nome completo" style="width:100%;"></div>
        <div style="flex:2;min-width:130px;"><label class="lbl-base">PIN</label><input type="text" id="uPin" placeholder="Mín. 4 caracteres" maxlength="8" style="width:100%;"></div>
        <div style="flex:2;min-width:140px;"><label class="lbl-base">PERFIL</label>
          <select id="uPerfil" class="inp-base">
            <option value="operador">👤 Operador</option><option value="admin">👑 Admin</option>
          </select></div>
      </div>
      <div id="uError" style="color:var(--bad);font-size:12.5px;min-height:16px;margin-top:10px;"></div>
      <div style="display:flex;gap:8px;margin-top:12px;"><button class="btn" id="uSave">Cadastrar</button><button class="btn secondary" id="btnHideForm">Cancelar</button></div>
    </div>
    ${tbl(admins,'👑 Administradores','#e3b341')}
    ${tbl(ops,'👤 Operadores','var(--teal-bright)')}
    ${!users.length?'<div class="empty-state">Nenhum usuário cadastrado ainda.</div>':''}
  </div>`;
  document.getElementById('btnShowForm').addEventListener('click',()=>{ document.getElementById('formCard').style.display=''; document.getElementById('btnShowForm').style.display='none'; document.getElementById('uNome').focus(); });
  document.getElementById('btnHideForm')?.addEventListener('click',()=>{ document.getElementById('formCard').style.display='none'; document.getElementById('btnShowForm').style.display=''; });
  document.getElementById('uSave').addEventListener('click',async()=>{
    const nome=document.getElementById('uNome').value.trim(), pin=document.getElementById('uPin').value.trim(), perfil=document.getElementById('uPerfil').value, err=document.getElementById('uError');
    if(!nome){err.textContent='Informe o nome.';return;}
    if(pin.length<4){err.textContent='PIN deve ter pelo menos 4 caracteres.';return;}
    if(users.find(u=>u.nome.toLowerCase()===nome.toLowerCase())){err.textContent='Já existe um usuário com esse nome.';return;}
    if(users.find(u=>u.pin===pin)){err.textContent='Esse PIN já está em uso.';return;}
    err.textContent=''; users.push({nome,pin,perfil});
    await window.storage.set('system:users',JSON.stringify(users),true); renderUsers();
  });
  app.querySelectorAll('[data-editperfil]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const idx=parseInt(btn.getAttribute('data-editperfil'));
      const u=users[idx];
      const novo=u.perfil==='admin'?'operador':'admin';
      const label=novo==='admin'?'👑 Administrador':'👤 Operador';
      if(!confirm('Alterar perfil de "'+u.nome+'" para '+label+'?')) return;
      users[idx].perfil=novo;
      await window.storage.set('system:users',JSON.stringify(users),true);
      renderUsers();
    });
  });

  app.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const idx=parseInt(btn.getAttribute('data-edit'));
      const np=prompt('Novo PIN para "'+users[idx].nome+'" (mín. 4 caracteres):','');
      if(!np||np.length<4){if(np!==null)alert('PIN muito curto.');return;}
      users[idx].pin=np; await window.storage.set('system:users',JSON.stringify(users),true); renderUsers();
    });
  });
  app.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const idx=parseInt(btn.getAttribute('data-del'));
      if(!confirm('Excluir "'+users[idx].nome+'"?'))return;
      users.splice(idx,1); await window.storage.set('system:users',JSON.stringify(users),true); renderUsers();
    });
  });
}

/* ===================== LOGIN DE USUÁRIO ===================== */
async function ensureUserLogin(){
  // Verifica se há usuários cadastrados
  let users = [];
  try{
    const snap = await window.storage.get('system:users', true);
    users = snap ? JSON.parse(snap.value) : [];
  }catch(e){ users = []; }

  // Se não há usuários cadastrados, mostra tela de login com aviso
  if(users.length === 0){
    await renderUserLogin(true); // true = modo sem usuários cadastrados
    return;
  }

  // Restaura sessão se válida (12h)
  try{
    const sess = await window.storage.get('userSession', false);
    if(sess){
      const u = JSON.parse(sess.value);
      if(u.ts && (Date.now()-u.ts) < 12*60*60*1000){
        const found = users.find(x=>x.nome===u.nome && x.pin===u.pin);
        if(found){
          currentUser=found; currentEmployee=found.nome;
          isAdmin=(found.perfil==='admin');
          if(isAdmin) showAdminBadge();
          renderTopControls();
          await renderChecklist();
          updateNavAdminVisibility();
          hideLoader();
          return;
        }
      }
      // Sessão expirada ou inválida
      try{ await window.storage.delete('userSession',false); }catch(e){}
    }
  }catch(e){}
  await renderUserLogin();
}

        <input type="password" id="pinAtual" placeholder="Mín. 4 caracteres" maxlength="8"
          style="width:100%;padding:9px 12px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;font-size:14px;font-family:inherit;">
      </div>
      <div class="form-row" style="margin-bottom:12px;">
        <label style="font-size:12px;color:var(--text-dim);">Novo PIN</label>
        <input type="password" id="pinNovo" placeholder="Mín. 4 caracteres" maxlength="8"
          style="width:100%;padding:9px 12px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;font-size:14px;font-family:inherit;">
      </div>
      <div class="form-row" style="margin-bottom:14px;">
        <label style="font-size:12px;color:var(--text-dim);">Confirmar novo PIN</label>
        <input type="password" id="pinConfirm" placeholder="Mín. 4 caracteres" maxlength="8"
          style="width:100%;padding:9px 12px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;font-size:14px;font-family:inherit;">
      </div>
      <div id="pinError" style="color:var(--bad);font-size:12px;min-height:16px;margin-bottom:10px;"></div>
      <div style="display:flex;gap:10px;">
        <button id="pinSave" class="btn" style="flex:1;">Salvar</button>
        <button id="pinCancel" class="btn secondary" style="flex:1;">Cancelar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('pinCancel').addEventListener('click', ()=>overlay.remove());
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('pinSave').addEventListener('click', async ()=>{
    const atual   = document.getElementById('pinAtual').value.trim();
    const novo    = document.getElementById('pinNovo').value.trim();
    const confirm = document.getElementById('pinConfirm').value.trim();
    const err     = document.getElementById('pinError');
    if(!atual||!novo||!confirm){ err.textContent='Preencha todos os campos.'; return; }
    if(atual !== currentUser?.pin){ err.textContent='PIN atual incorreto.'; return; }
    if(!novo.length >= 4){ err.textContent='Novo PIN deve ter pelo menos 4 caracteres.'; return; }
    if(novo !== confirm){ err.textContent='Os PINs não coincidem.'; return; }
    err.textContent='';
    try{
      const snap = await window.storage.get('system:users', true);
      const users = snap ? JSON.parse(snap.value) : [];
      const idx = users.findIndex(u=>u.nome===currentUser.nome&&u.pin===currentUser.pin);
      if(idx<0){ err.textContent='Usuário não encontrado.'; return; }
      if(users.find((u,i)=>i!==idx&&u.pin===novo)){ err.textContent='Esse PIN já está em uso.'; return; }
      users[idx].pin = novo;
      currentUser.pin = novo;
      await window.storage.set('system:users', JSON.stringify(users), true);
      await window.storage.set('userSession', JSON.stringify(currentUser), false);
      overlay.remove();
      alert('✅ PIN alterado com sucesso!');
    }catch(e){ err.textContent='Erro ao salvar. Tente novamente.'; }
  });
}

      else { filtered.forEach(item=>{ const div=document.createElement('div'); div.className='lsearch-item'; div.textContent=item.text; div.addEventListener('mousedown',e=>{ e.preventDefault(); input.value=item.text; hidden.value=item.value; dd.classList.remove('open'); }); div.addEventListener('touchend',e=>{ e.preventDefault(); input.value=item.text; hidden.value=item.value; dd.classList.remove('open'); input.blur(); }); dd.appendChild(div); }); }

// Troca de aba no quiosque
function kSwitchTab(tab){
  document.getElementById('kPanelNew').style.display    = tab==='new'   ? 'block' : 'none';
  document.getElementById('kPanelCheck').style.display  = tab==='check' ? 'block' : 'none';
  document.getElementById('kPanelMine').style.display   = tab==='mine'  ? 'block' : 'none';
  document.getElementById('kSuccess').style.display     = 'none';
  ['kTabNew','kTabMine','kTabCheck'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const active = (id==='kTabNew'&&tab==='new')||(id==='kTabMine'&&tab==='mine')||(id==='kTabCheck'&&tab==='check');
    el.style.background = active ? 'var(--teal)' : 'var(--panel)';
    el.style.color      = active ? '#fff'        : 'var(--text)';
    el.style.border     = active ? 'none'        : '1px solid var(--line)';
  });

  if(tab==='check'){
    // Wire search button
    setTimeout(()=>{
      const btn = document.getElementById('kSearchBtn');
      if(btn && !btn._wired){
        btn._wired = true;
        btn.addEventListener('click', async ()=>{
          const code = document.getElementById('kCodeInput').value.trim().toUpperCase().replace('#','');
          const result = document.getElementById('kCheckResult');
          if(!code){ result.innerHTML='<div style="color:var(--bad);font-size:13px;">Informe o código.</div>'; return; }
          btn.disabled=true; btn.textContent='Consultando...';
          const r = await loadRequest(code);
          btn.disabled=false; btn.textContent='Consultar';
          if(!r || !r.id){
            result.innerHTML='<div style="color:var(--bad);font-size:13px;">Solicitação não encontrada. Verifique o código.</div>';
            return;
          }
          const statusMap = {
            aberta:   {label:'⏳ Pendente',      color:'var(--amber)'},
            andamento:{label:'🔧 Em andamento',   color:'var(--teal-bright)'},
            concluida:{label:'✅ Concluída',       color:'var(--ok)'},
          };
          const s = statusMap[r.status] || {label:r.status, color:'var(--text)'};
          const assigneeHtml = r.assignee ? '<div style="font-size:13px;color:var(--text-dim);margin-top:4px;"><strong style="color:var(--text);">Responsável:</strong> '+r.assignee+'</div>' : '';
          const closedHtml   = r.closedAt  ? '<div style="font-size:13px;color:var(--ok);margin-top:4px;">Concluída em: '+fmtBRTime(new Date(r.closedAt))+'</div>' : '';
          result.innerHTML =
            '<div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;">' +
              '<div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">SOLICITAÇÃO #'+r.id+'</div>' +
              '<div style="font-size:15px;font-weight:700;color:'+s.color+';margin-bottom:10px;">'+s.label+'</div>' +
              '<div style="font-size:13px;color:var(--text-dim);"><strong style="color:var(--text);">Local:</strong> '+r.local+'</div>' +
              '<div style="font-size:13px;color:var(--text-dim);margin-top:4px;"><strong style="color:var(--text);">Descrição:</strong> '+r.desc+'</div>' +
              assigneeHtml + closedHtml +
              '<div style="font-size:11px;color:var(--text-dim);margin-top:8px;">Aberta em: '+fmtBRTime(new Date(r.createdAt))+'</div>' +
            '</div>';
        });
      }
      // Wire mine button
      const mineBtn = document.getElementById('kMineBtn');
      if(mineBtn && !mineBtn._wired){
        mineBtn._wired = true;
        mineBtn.addEventListener('click', async ()=>{
          const nome = document.getElementById('kMineInput').value.trim().toLowerCase();
          const result = document.getElementById('kMineResult');
          if(!nome){ result.innerHTML='<div style="color:var(--bad);font-size:13px;">Informe seu nome.</div>'; return; }
          mineBtn.disabled=true; mineBtn.textContent='Buscando...';
          await ensureRequestsLoaded();

          const all = _requests.filter(r=> r.nome && r.nome.toLowerCase().includes(nome))
                                .sort((a,b)=>b.createdAt-a.createdAt);
          mineBtn.disabled=false; mineBtn.textContent='Buscar minhas solicitações';

            result.innerHTML='<div style="font-size:13px;color:var(--text-dim);text-align:center;padding:20px 0;">Nenhuma solicitação encontrada para "<strong>'+nome+'</strong>".</div>';
            return;
          }
          const statusMap={aberta:{label:'⏳ Pendente',color:'var(--amber)'},andamento:{label:'🔄 Em andamento',color:'#2563eb'},concluida:{label:'✅ Concluída',color:'var(--ok)'}};

          function cardHtml(r){
            const s=statusMap[r.status]||{label:r.status,color:'var(--text)'};
            return '<div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;">'+
              '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'+
                '<span style="font-size:11px;color:var(--text-dim);">#'+r.id+'</span>'+
                '<span style="font-size:12px;font-weight:700;color:'+s.color+';">'+s.label+'</span>'+

              '<div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;">'+r.tipo+'</div>'+

            '</div>';
          }

          let activeFilter='todas';
          function renderFull(){
            const ct={todas:all.length,aberta:all.filter(r=>r.status==='aberta').length,andamento:all.filter(r=>r.status==='andamento').length,concluida:all.filter(r=>r.status==='concluida').length};
            const filtered=activeFilter==='todas'?all:all.filter(r=>r.status===activeFilter);
            result.innerHTML=
              '<div style="font-size:12px;color:var(--text-dim);margin-bottom:10px;">'+all.length+' solicitação(ões) no histórico</div>'+
              '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">'+
                [['todas','Todas'],['aberta','⏳ Pendentes'],['andamento','🔄 Em andamento'],['concluida','✅ Concluídas']].map(([v,l])=>
                  '<button data-f="'+v+'" style="padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:'+(activeFilter===v?'var(--teal)':'var(--panel)')+';color:'+(activeFilter===v?'#06211f':'var(--text-dim)')+';">'+l+' ('+ct[v]+')</button>'
                ).join('')+
              '</div>'+
              (filtered.length?filtered.map(cardHtml).join(''):'<div style="font-size:13px;color:var(--text-dim);text-align:center;padding:20px 0;">Nenhuma solicitação neste filtro.</div>');
            result.querySelectorAll('[data-f]').forEach(btn=>{
              btn.addEventListener('click',()=>{ activeFilter=btn.getAttribute('data-f'); renderFull(); });
            });
          }
          renderFull();
        });
      }
    }, 100);
  }
}

  async function buildConsolidado(ano,mes){

    <div style="display:flex;gap:10px;margin-bottom:24px;border-bottom:1px solid var(--line);">
      <button id="efTab-dia" style="padding:10px 20px;background:none;border:none;border-bottom:2px solid var(--teal-bright);color:var(--teal-bright);font-weight:600;font-size:14px;cursor:pointer;">📅 Lançamento Diário</button>
      <button id="efTab-contratado" style="padding:10px 20px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-dim);font-size:14px;cursor:pointer;">👷 Efetivo Contratado</button>
    </div>
    <div id="efPanel-dia">
      <div style="margin-bottom:20px;">
        <div style="font-size:18px;font-weight:700;">📅 Efetivo do Dia</div>
        <div style="font-size:13px;color:var(--text-dim);margin-top:2px;">${['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][currentDate.getDay()]+', '+fmtBR(currentDate)} — Plantões ativos: <span style="color:var(--teal-bright);">${turnosDia.map(t=>TURNO_LABELS[t.key]).join(' · ')}</span></div>
      </div>
      ${turnosDia.map(turnoCard).join('')}
      <div class="section-title" style="margin-top:8px;">Histórico — últimos 14 dias</div>
      <div class="card" style="padding:0;overflow:hidden;margin-bottom:24px;" id="histCard">${hist}</div>
      <div class="section-title">Consolidado do mês</div>
      <div class="card">
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;">
          <div><label class="lbl-base">MÊS</label>
            <select id="consolMes" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;font-size:13px;font-family:inherit;">${mesOpts}</select></div>
          <div><label class="lbl-base">ANO</label>
            <select id="consolAno" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;font-size:13px;font-family:inherit;">${anoOpts}</select></div>
          <button class="btn secondary" id="btnConsol">Calcular</button>
        </div>
        <div id="consolResult">${consolPlaceholder}</div>
      </div>
    </div>
    <div id="efPanel-contratado" style="display:none;">${isAdmin ? adminPanel : '<div class="empty-state" style="margin-top:40px;">⛔ Acesso restrito ao administrador.</div>'}</div>
  </div>`;

  function switchEfTab(tab){
    efAbaAtiva=tab;
    const dia=document.getElementById('efPanel-dia'), cont=document.getElementById('efPanel-contratado');
    const tDia=document.getElementById('efTab-dia'), tCont=document.getElementById('efTab-contratado');
    if(!dia||!cont||!tDia||!tCont) return;
    if(tab==='dia'){ dia.style.display=''; cont.style.display='none'; tDia.style.cssText='padding:10px 20px;background:none;border:none;border-bottom:2px solid var(--teal-bright);color:var(--teal-bright);font-weight:600;font-size:14px;cursor:pointer;'; tCont.style.cssText='padding:10px 20px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-dim);font-size:14px;cursor:pointer;'; }
    else { dia.style.display='none'; cont.style.display=''; tCont.style.cssText='padding:10px 20px;background:none;border:none;border-bottom:2px solid var(--teal-bright);color:var(--teal-bright);font-weight:600;font-size:14px;cursor:pointer;'; tDia.style.cssText='padding:10px 20px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-dim);font-size:14px;cursor:pointer;'; }
  }
  document.getElementById('efTab-dia')?.addEventListener('click',()=>switchEfTab('dia'));
  document.getElementById('efTab-contratado')?.addEventListener('click',()=>switchEfTab('contratado'));
  if(efAbaAtiva==='contratado') switchEfTab('contratado');

  setTimeout(async()=>{ const hc=document.getElementById('histCard'); if(hc){ hc.innerHTML=await buildHistorico(); } },0);

  turnosDia.forEach(t=>{
    const sel=document.getElementById('nsel-'+t.key), txt=document.getElementById('ntxt-'+t.key), csel=document.getElementById('csel-'+t.key);
    if(!sel||!txt) return;
    sel.addEventListener('change',()=>{ txt.style.display=sel.value==='__outro__'?'block':'none'; if(sel.value==='__outro__'){ txt.focus(); if(csel) csel.value=''; return; } if(csel&&sel.value&&colabMap[sel.value]) csel.value=colabMap[sel.value]; });
  });

  app.querySelectorAll('[data-add-t]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const tk=btn.getAttribute('data-add-t');
      const sel=document.getElementById('nsel-'+tk), txt=document.getElementById('ntxt-'+tk), csel=document.getElementById('csel-'+tk);
      let nome=sel.value==='__outro__'?txt.value.trim():sel.value; let cargo=csel.value;
      if(!cargo&&sel.value!=='__outro__'&&colabMap[nome]) cargo=colabMap[nome];
      if(!nome){(sel.value==='__outro__'?txt:sel).focus();return;} if(!cargo){csel.focus();return;}
      if(!data[tk])data[tk]=[];
      if(data[tk].find(p=>p.nome===nome)){alert('"'+nome+'" já lançado neste turno.');return;}
      data[tk].push({nome,cargo,ts:Date.now(),by:currentUser?.nome||currentEmployee||''});
      data._turnos=turnosDia.map(x=>x.key);
      await saveEfetivo(ds,data);
      // Update only the list — no full page reload to avoid scroll-to-top
      const lista2=data[tk]||[];
      const tbody=document.querySelector(`table[data-turno="${tk}"] tbody`);
      if(tbody){
        tbody.innerHTML=lista2.map((p,i)=>`<tr>
          <td style="padding:9px 12px;font-size:13px;">${i+1}</td>
          <td style="padding:9px 12px;font-size:13px;font-weight:500;">${p.nome}</td>
          <td style="padding:9px 12px;"><span style="font-size:12px;background:var(--panel-2);padding:3px 10px;border-radius:20px;color:var(--teal-bright);">${p.cargo||'—'}</span></td>
          <td style="padding:9px 12px;text-align:right;">${isAdmin?`<button class="btn small secondary" data-del-t="${tk}" data-del-i="${i}" style="color:var(--bad);border-color:var(--bad);padding:4px 10px;">✕</button>`:''}</td>
        </tr>`).join('');
        // Re-wire delete buttons in updated tbody
        tbody.querySelectorAll('[data-del-t]').forEach(db=>{
          db.addEventListener('click',async()=>{
            const dtk=db.getAttribute('data-del-t'), didx=parseInt(db.getAttribute('data-del-i'));
            if(!confirm('Remover?'))return; data[dtk].splice(didx,1); await saveEfetivo(ds,data); renderEfetivo();
          });
        });
        // Update counter
        const counter=document.getElementById('efcount-'+tk);
        if(counter) counter.textContent=lista2.length+' colaborador'+(lista2.length!==1?'es':'')+' presente'+(lista2.length!==1?'s':'');
        // Reset form fields
        sel.value=''; if(txt){txt.value='';txt.style.display='none';} if(csel) csel.value='';
      } else {
        renderEfetivo(); // fallback
      }
    });
  });

  app.querySelectorAll('[data-del-t]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const tk=btn.getAttribute('data-del-t'), idx=parseInt(btn.getAttribute('data-del-i'));
      if(!confirm('Remover?'))return; data[tk].splice(idx,1); await saveEfetivo(ds,data); renderEfetivo();
    });
  });

  document.getElementById('btnSaveColab')?.addEventListener('click',async()=>{
    const nome=document.getElementById('novoColab').value.trim(), cargo=document.getElementById('novoColabCargo').value;
    if(!nome) return; if(!cargo){document.getElementById('novoColabCargo').focus();return;}
    if(colabs.find(p=>(p.nome||p)===nome)){alert('Já cadastrado.');return;}
    colabs.push({nome,cargo,status:'ativo'}); colabs.sort((a,b)=>(a.nome||a).localeCompare(b.nome||b));
    await saveColaboradores(colabs); document.getElementById('novoColab').value=''; document.getElementById('novoColabCargo').value='';
    renderEfetivo('contratado');
  });

  app.querySelectorAll('[data-filter-status]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const filter=btn.getAttribute('data-filter-status');
      app.querySelectorAll('[data-filter-status]').forEach(b=>b.classList.add('secondary')); btn.classList.remove('secondary');
      app.querySelectorAll('tr[data-colab-status]').forEach(row=>{ row.style.display=(filter==='todos'||row.getAttribute('data-colab-status')===filter)?'':'none'; });
    });
  });

  app.querySelectorAll('[data-status-colab]').forEach(sel=>{
    sel.addEventListener('change',async()=>{
      const i=parseInt(sel.getAttribute('data-status-colab')); colabs[i].status=sel.value;
      await saveColaboradores(colabs); renderEfetivo('contratado');
    });
  });

  app.querySelectorAll('[data-editcolab]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=parseInt(btn.getAttribute('data-editcolab')); const p=colabs[i];
      const nome=p.nome||p; const cargo=p.cargo||''; const status=p.status||'ativo';
      const row=document.getElementById('colab-row-'+i); if(!row) return;
      row.innerHTML=`<td style="padding:8px 10px;" colspan="2">
        <input id="edit-nome-${i}" value="${nome}" style="width:100%;background:var(--panel-2);border:1px solid var(--teal);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;font-family:inherit;margin-bottom:6px;">
        <select id="edit-cargo-${i}" style="width:100%;background:var(--panel-2);border:1px solid var(--teal);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;font-family:inherit;">
          ${CARGOS_EFETIVO.map(cg=>`<option value="${cg}" ${cg===cargo?'selected':''}>${cg}</option>`).join('')}
        </select></td>
        <td style="padding:8px 10px;" colspan="2"><select id="edit-status-${i}" style="width:100%;background:var(--panel-2);border:1px solid var(--teal);color:var(--text);padding:7px 10px;border-radius:7px;font-size:13px;font-family:inherit;">
          <option value="ativo" ${status==='ativo'?'selected':''}>✅ Ativo</option>
          <option value="ferias" ${status==='ferias'?'selected':''}>🌴 Férias</option>
          <option value="atestado" ${status==='atestado'?'selected':''}>🏥 Atestado</option>
          <option value="desligado" ${status==='desligado'?'selected':''}>🚫 Desligado</option>
        </select></td>
        <td style="padding:8px 10px;text-align:right;white-space:nowrap;">
          <button id="edit-save-${i}" class="btn small" style="margin-right:6px;">✅ Salvar</button>
          <button id="edit-cancel-${i}" class="btn small secondary">✕</button>
        </td>`;
      document.getElementById('edit-save-'+i)?.addEventListener('click',async()=>{
        const nn=document.getElementById('edit-nome-'+i).value.trim(), nc=document.getElementById('edit-cargo-'+i).value, ns=document.getElementById('edit-status-'+i).value;
        if(!nn) return; colabs[i]={nome:nn,cargo:nc,status:ns}; await saveColaboradores(colabs); renderEfetivo('contratado');
      });
      document.getElementById('edit-cancel-'+i)?.addEventListener('click',()=>renderEfetivo('contratado'));
    });
  });

  app.querySelectorAll('[data-rmcolab]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const i=parseInt(btn.getAttribute('data-rmcolab'));
      if(!confirm('Remover "'+colabs[i].nome+'"?'))return;
      colabs.splice(i,1); await saveColaboradores(colabs); renderEfetivo('contratado');
    });
  });

  document.getElementById('btnConsol')?.addEventListener('click',async()=>{
    const m=parseInt(document.getElementById('consolMes').value), a=parseInt(document.getElementById('consolAno').value);
    const res=await buildConsolidado(a,m);
    document.getElementById('consolResult').innerHTML=`<div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));">
      <div class="stat-box"><div class="num">${res.totalPrev||'—'}</div><div class="lbl">Previsto no mês</div></div>
      <div class="stat-box"><div class="num" style="color:var(--ok);">${res.totalReal}</div><div class="lbl">Realizado no mês</div></div>
      <div class="stat-box"><div class="num" style="color:${res.deficit>=0?'var(--ok)':'var(--bad)'};">${res.deficit>=0?'+':''}${res.deficit}</div><div class="lbl">Déficit acumulado</div></div>
      <div class="stat-box"><div class="num" style="color:${res.ader>=90?'var(--ok)':res.ader>=70?'var(--amber)':'var(--bad)'};">${res.ader?res.ader+'%':'—'}</div><div class="lbl">Aderência mensal</div></div>
    </div>`;
  });
}

// Wire navEfetivo
document.getElementById('navEfetivo').addEventListener('click',()=>{
  section='efetivo';
  document.querySelectorAll('.mainnav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('navEfetivo').classList.add('active');
  renderTopControls();
  renderEfetivo();
});

</script>
</body>
</html>
