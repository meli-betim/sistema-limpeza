// Wrapper com timeout para evitar travamento em chamadas Firebase
function withTimeout(promise, ms=8000){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}

window.storage = {
  async get(key, shared){
    if(LOCAL_ONLY_KEYS.has(key)){
      try{
        const raw = localStorage.getItem('sistema_limpeza_local::'+key);
        return raw===null ? null : { key, value: raw, shared:false };
      }catch(e){ return null; }
    }
    try{
      const snap = await withTimeout(fbRoot.child(encodeKey(key)).get());
      if(!snap.exists()) return null;
      return { key, value: snap.val(), shared: !!shared };
    }catch(e){ console.error('Firebase get error', e); return null; }
  },
  async set(key, value, shared){
    if(LOCAL_ONLY_KEYS.has(key)){
      try{
        localStorage.setItem('sistema_limpeza_local::'+key, value);
        return { key, value, shared:false };
      }catch(e){ return null; }
    }
    try{
      await withTimeout(fbRoot.child(encodeKey(key)).set(value));
      return { key, value, shared: !!shared };
    }catch(e){ console.error('Firebase set error', e); return null; }
  },
  async delete(key, shared){
    if(LOCAL_ONLY_KEYS.has(key)){
      try{ localStorage.removeItem('sistema_limpeza_local::'+key); return { key, deleted:true, shared:false }; }
      catch(e){ return null; }
    }
    try{
      await withTimeout(fbRoot.child(encodeKey(key)).remove());
      return { key, deleted:true, shared: !!shared };
    }catch(e){ console.error('Firebase delete error', e); return null; }
  },
  async list(prefix, shared){
    try{
      const snap = await withTimeout(fbRoot.get());
      if(!snap.exists()) return { keys:[], prefix, shared: !!shared };
      const all = Object.keys(snap.val()).map(decodeKey);
      const keys = prefix ? all.filter(k=>k.startsWith(prefix)) : all;
      return { keys, prefix, shared: !!shared };
    }catch(e){ console.error('Firebase list error', e); return null; }
  }
};

   de LOCATIONS trocando apenas as entradas de Mezanino/HS pelas antigas — o restante dos ambientes
   (inclusive banheiros) é o mesmo objeto/config em ambas as listas.
   getLocationsForDate(date) decide qual configuração usar: datas < CONFIG_CUTOVER_DATE usam a antiga;

  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));

}

function resolveFreq(loc, turnKey, date){
  // Sempre usa a data explicitamente passada (lida do seletor de data do formulário).
  // Cria uma cópia normalizada para garantir que getDay() reflita o dia correto
  // independentemente do fuso horário local — evita off-by-one quando a data
  // vem de um <input type="date"> (ex: "2025-07-22" → new Date("2025-07-22")
  // é interpretado como UTC meia-noite, mas getDay() usa hora local).
  const ref = date ? (() => {
    const d = new Date(date);
    // Se a data veio de um input type="date" ela já está como objeto Date local;
    // se por acaso for meia-noite UTC (string ISO), corrige para o dia local:
    if(d.getHours()===0 && d.getMinutes()===0 && d.getTimezoneOffset()!==0){
      d.setMinutes(d.getMinutes() + d.getTimezoneOffset()); // ajusta para local
    }
    return d;
  })() : currentDate;
  const dow = ref.getDay(); // 0=Dom, 1=Seg … 6=Sáb

  const raw = loc.f[turnKey];
  if(raw === '3pw'){
    // Seg(1), Qua(3), Sex(5)
    return (dow===1||dow===3||dow===5) ? 1 : 0;
  }
  if(typeof raw === 'string' && raw.startsWith('wk:')){
    // 'wk:2,5' = ocorre nos dias da semana informados (0=Dom..6=Sáb), 1x em cada
    const days = raw.slice(3).split(',').map(Number);
    return days.includes(dow) ? 1 : 0;
  }
  return typeof raw === 'number' ? raw : 0;
}

/* ===================== ATRASO AUTOMÁTICO =====================
   Turno 1: 06h–18h  |  Turno 2: 18h–06h (do dia seguinte).
   Em cada dia, só uma das colunas (Par ou Ímpar) do turno está "em jogo",
   dependendo se o dia do mês é par ou ímpar. As ocorrências daquele turno
   são distribuídas em intervalos iguais dentro das 12h — ex: 6 ocorrências
   = 1 a cada 2h. Se o horário-limite de uma ocorrência já passou e ela
   continua "pendente", ela é destacada em vermelho automaticamente (sem
   alterar o dado salvo — é só um alerta visual). */
function isParDay(date){ return date.getDate()%2===0; }
function turnParity(turnKey){ return (turnKey==='T1D'||turnKey==='T1N') ? 'par' : 'impar'; }
function getShiftWindow(turnKey, date){
  const d = new Date(date); d.setHours(0,0,0,0);
  if(turnKey==='T1D' || turnKey==='T2D'){
    const start = new Date(d); start.setHours(7,0,0,0);
    const end = new Date(d); end.setHours(19,0,0,0);
    return {start, end};
  } else {
    const start = new Date(d); start.setHours(19,0,0,0);
    const end = new Date(d); end.setDate(end.getDate()+1); end.setHours(7,0,0,0);
    return {start, end};
  }
}
function occDeadline(loc, turnKey, idx, date){
  const n = resolveFreq(loc, turnKey, date);
  if(!n || idx>=n) return null;
  // Locais com janelas fixas (ex.: Refeitório Meli): o prazo é o horário de término
  // da própria refeição, em vez de intervalos iguais dentro do turno.
  if(loc.meals && loc.meals[turnKey] && loc.meals[turnKey][idx]){
    const m = loc.meals[turnKey][idx];
    const d = new Date(date); d.setHours(0,0,0,0);
    d.setHours(m.end[0], m.end[1], 0, 0);
    return d;
  }
  const {start,end} = getShiftWindow(turnKey, date);
  const interval = (end-start)/n;
  return new Date(start.getTime() + interval*(idx+1));
}
// Retorna true se o local é banheiro (frequência 6 por turno)
function isBathroomLoc(loc){
  return Object.values(loc.f).some(v => v === 6);
}
// Retorna a tolerância de bloqueio após o deadline (ms)
// Última ocorrência do turno: 30min após FIM do turno
// Demais ocorrências: 1h após o deadline da ocorrência
function blockTolerance(loc, turnKey, idx, date){
  const n = resolveFreq(loc, turnKey, date);
  const {end} = getShiftWindow(turnKey, date);
  const dl = occDeadline(loc, turnKey, idx, date);
  if(!dl) return 60*60*1000;
  const isLast = (idx === n-1);
  if(isLast){
    // Última ocorrência: permite até 30min após o fim do turno
    return (end.getTime() + 30*60*1000) - dl.getTime();
  } else {
    // Demais: 1h de tolerância após o deadline
    return 60*60*1000;
  }
}

// Overdue unificado: pendente e passou do deadline
function isOverdue(loc, turnKey, idx, date, state){
  if(state!=='pending') return false;
  const dayPar = isParDay(date);
  const colParity = turnParity(turnKey);
  if((dayPar && colParity!=='par') || (!dayPar && colParity!=='impar')) return false;
  const deadline = occDeadline(loc, turnKey, idx, date);
  if(!deadline) return false;
  const nowMs = new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'})).getTime();
  return nowMs > deadline.getTime();
}

// Blocked unificado: pendente e passou deadline + tolerância
// Para banheiros: também bloqueia se muito cedo (>2h antes)
function isBlockedLate(loc, turnKey, idx, date, state){
  if(state !== 'pending') return false;
  if(isAdmin) return false;
  const deadline = occDeadline(loc, turnKey, idx, date);
  if(!deadline) return false;
  const nowMs = new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'})).getTime();
  const dl = deadline.getTime();
  const tol = blockTolerance(loc, turnKey, idx, date);
  const tooLate = nowMs > dl + tol;
  if(isBathroomLoc(loc)){
    // Banheiros: também bloqueia antecipação >2h
    const tooEarly = nowMs < dl - 2*60*60*1000;
    return tooEarly || tooLate;
  }
  return tooLate;
}

function isNonBathroomBlocked(turnKey, date, state){ return false; } // não usado mais
// T1D/T2D = Par, T1N/T2N = Ímpar
// Dentro do turno: T*D (diurno) = 06:00-18:00 | T*N (noturno) = 18:00-06:00
// Retorna a hora BRT atual como objeto Date
function nowBRT(){ return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'})); }

function isTurnBlocked(turnKey){
  if(isAdmin) return false;
  // Usa fuso de Brasília (UTC-3) para garantir horário correto independente do dispositivo
  const nowBRT = new Date(new Date().toLocaleString('en-US', {timeZone:'America/Sao_Paulo'}));
  const h = nowBRT.getHours();
  const isDiurnoAgora = h >= 7 && h < 19;
  // D = diurno (06-18h), N = noturno (18-06h)
  const turnIsDiurno  = turnKey === 'T1D' || turnKey === 'T2D';
  const turnIsNoturno = turnKey === 'T1N' || turnKey === 'T2N';
  if(turnIsDiurno  && !isDiurnoAgora) return true;  // turno diurno bloqueado à noite
  if(turnIsNoturno &&  isDiurnoAgora) return true;  // turno noturno bloqueado de dia
  return false;
}

/* ===================== FOTO ANEXADA NAS SOLICITAÇÕES =====================
   Comprime a imagem no navegador (redimensiona + JPEG) antes de salvar como
   base64 junto da solicitação no Firebase — evita depender de um serviço de
   armazenamento de arquivos separado. */
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('Não foi possível ler a imagem.'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('Não foi possível ler o arquivo.'));
    reader.readAsDataURL(file);
  });
}
async function compressImageWithLimit(file, maxBytes){
  let dataUrl = await compressImage(file, 900, 0.6);
  if(dataUrl.length > maxBytes) dataUrl = await compressImage(file, 700, 0.45);
  if(dataUrl.length > maxBytes) dataUrl = await compressImage(file, 500, 0.35);
  return dataUrl;
}

      renderTopControls(); renderChecklist();
    };
    document.getElementById('nextBtn').onclick = ()=>{
      currentDate.setDate(currentDate.getDate() + (mode==='week'?7:1));
      renderTopControls(); renderChecklist();
    };
    document.getElementById('btnHoje').onclick = ()=>{
      currentDate = new Date();
      renderTopControls(); renderChecklist();
    };
    wireUserPillButtons();
  } else if(section==='report'){
    tc.innerHTML = `
      ${userPill}
      <div class="seg">
        <button id="repDay" class="${reportPeriod==='day'?'active':''}">Dia</button>
        <button id="repWeek" class="${reportPeriod==='week'?'active':''}">Semana</button>
        <button id="repMonth" class="${reportPeriod==='month'?'active':''}">Mês</button>
      </div>
      <button class="nav-btn" id="repPrev">‹</button>
      <div style="display:flex;flex-direction:column;align-items:center;gap:1px;">
        <span style="font-size:10px;color:rgba(255,255,255,.7);">${['DOM','SEG','TER','QUA','QUI','SEX','SÁB'][reportDate.getDay()]}</span>
        <input type="date" id="repDatePicker" value="${dateStr(reportDate)}">
      </div>
      <button class="nav-btn" id="repNext">›</button>
      <button class="btn small" id="repHoje" style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;padding:5px 10px;font-size:12px;">Hoje</button>
    `;
    document.getElementById('repDay').onclick = ()=>{reportPeriod='day'; renderTopControls(); renderReport();};
    document.getElementById('repWeek').onclick = ()=>{reportPeriod='week'; renderTopControls(); renderReport();};
    document.getElementById('repMonth').onclick = ()=>{reportPeriod='month'; renderTopControls(); renderReport();};
    document.getElementById('repDatePicker').onchange = (e)=>{
      const [y,m,d] = e.target.value.split('-').map(Number);
      reportDate = new Date(y,m-1,d);
      renderTopControls(); renderReport();
    };
    document.getElementById('repHoje').onclick = ()=>{
      reportDate = new Date();
      renderTopControls(); renderReport();
    };
    document.getElementById('repPrev').onclick = ()=>{
      if(reportPeriod==='day') reportDate.setDate(reportDate.getDate()-1);
      else if(reportPeriod==='week') reportDate.setDate(reportDate.getDate()-7);
      else reportDate.setMonth(reportDate.getMonth()-1);
      renderTopControls(); renderReport();
    };
    document.getElementById('repNext').onclick = ()=>{
      if(reportPeriod==='day') reportDate.setDate(reportDate.getDate()+1);
      else if(reportPeriod==='week') reportDate.setDate(reportDate.getDate()+7);
      else reportDate.setMonth(reportDate.getMonth()+1);
      renderTopControls(); renderReport();
    };
    wireUserPillButtons();
  } else {
    tc.innerHTML = userPill;
    wireUserPillButtons();
  }
}

function wireUserPillButtons(){

function showBlockedAlert(type, availableAt){
  let el = document.getElementById('blockedAlertBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'blockedAlertBanner';
    document.body.appendChild(el);
  }
  if(type === 'turn'){
    el.innerHTML = `🕐 <strong>Fora do horário do turno.</strong><br>Este turno só pode ser registrado a partir das <strong>${availableAt}</strong>.`;
  } else if(type === 'early'){
    el.innerHTML = `⏳ <strong>Ainda não está no horário.</strong><br>Esta limpeza só pode ser registrada a partir das <strong>${availableAt}</strong>.`;
  } else {
    el.innerHTML = '⏱ <strong>Prazo encerrado.</strong><br>O prazo máximo para lançar esta limpeza é de até <strong>2 horas</strong> após o horário planejado. A ocorrência foi contabilizada como <strong>não realizada</strong>.';
  }
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.display='none'; }, 4000);
}

function hideLoader(){
  const ol = document.getElementById('loadingOverlay');

}
/* ===================== HOME ===================== */

async function renderChecklist(){
  if(mode==='day') await renderDay(); else await renderWeek();
}

async function renderDay(){
  const app = document.getElementById('app');
  // Preserva a posição de rolagem atual (desktop e celular) para restaurar após o re-render.
  const _scrollY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
  if(!app.innerHTML.includes('loading')) app.innerHTML = '<div class="loading">Carregando...</div>';
  const ds = dateStr(currentDate);
  const data = await loadDay(ds);
  const dayLocations = getLocationsForDate(currentDate);

  let totalOcc=0, doneOcc=0;
  const turns = activeTurns(currentDate);
  dayLocations.forEach(loc=>{
    turns.forEach(t=>{
      const n = resolveFreq(loc, t.key, currentDate);
      for(let i=0;i<n;i++){
        totalOcc++;
        const k = loc.name+'|'+t.key+'|'+i;
        if(getEntry(data,k).state==='done') doneOcc++;
      }
    });
  });
  const pct = totalOcc? Math.round(doneOcc/totalOcc*100):0;

  // turn color scheme: Par = teal, Ímpar = amber/purple
  const TURN_COLORS = {
    T1D: { head:'#1a5c5e', accent:'#3fd6c9', label:'Par' },
    T2D: { head:'#3b2a6b', accent:'#a78bfa', label:'Ímpar' },
    T1N: { head:'#1a5c5e', accent:'#3fd6c9', label:'Par' },
    T2N: { head:'#3b2a6b', accent:'#a78bfa', label:'Ímpar' },
  };

  let html = `
    <div class="progress-bar-outer">
      <div class="label">${['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][currentDate.getDay()]+', '+fmtBR(currentDate)} — progresso do dia</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-pct">${pct}%</div>
    </div>

    <!-- lupa / filtro -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <div class="lsearch-wrap">
        <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text-dim);pointer-events:none;z-index:1;">🔍</span>
        <input type="text" id="locSearch" placeholder="Buscar local..." autocomplete="off"
          style="width:100%;padding:9px 12px 9px 34px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;font-size:13.5px;">
        <div class="lsearch-dd" id="locSearchDD"></div>
      </div>
      <div style="display:flex;gap:8px;font-size:12px;">
        ${currentDate.getDate()%2===0
          ? '<span style="display:flex;align-items:center;gap:5px;color:#3fd6c9;font-weight:700;"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#1f8a8c;"></span>Dia par — exibindo T1 Par e T2 Par</span>'
          : '<span style="display:flex;align-items:center;gap:5px;color:#a78bfa;font-weight:700;"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#7c3aed;"></span>Dia ímpar — exibindo T1 Ímpar e T2 Ímpar</span>'
        }
      </div>
    </div>

    <div class="turn-grid" id="turnGrid">
  `;

  turns.forEach(t=>{
    const tc = TURN_COLORS[t.key];
    html += `<div class="turn-card" data-turn="${t.key}" style="border-color:${tc.accent}33;">
      <div class="turn-head" style="background:${tc.head};border-bottom-color:${tc.accent}44;">
        <span style="color:${tc.accent};">${t.label}</span>
        <span class="count" data-turncount="${t.key}" style="color:${tc.accent};opacity:.7;"></span>
      </div>`;
    dayLocations.forEach(loc=>{
      const n = resolveFreq(loc, t.key, currentDate);
      if(n<=0) return;
      html += `<div class="loc-row" data-locname="${loc.name.toLowerCase()}"><div class="loc-name">${loc.name}</div><div class="occ-list">`;
      for(let i=0;i<n;i++){
        const k = loc.name+'|'+t.key+'|'+i;
        const entry = getEntry(data,k);
        const st = entry.state || 'pending';
        const overdue = isOverdue(loc, t.key, i, currentDate, st);
        const blocked = isBlockedLate(loc, t.key, i, currentDate, st) || (st==='pending' && isTurnBlocked(t.key));
        const cls = blocked ? 'overdue blocked-late' : overdue ? 'overdue' : st;
        const mealInfo = (loc.meals && loc.meals[t.key] && loc.meals[t.key][i]) ? loc.meals[t.key][i] : null;
        const fmt2 = (h,m)=>String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
        let title = mealInfo
          ? mealInfo.label+' — '+fmt2(mealInfo.start[0],mealInfo.start[1])+' às '+fmt2(mealInfo.end[0],mealInfo.end[1])
          : 'Pendente';
        if(entry.ts){
          title = (st==='done'?'Concluído':'Não realizado')+' em '+fmtBR(new Date(entry.ts))+' '+fmtTime(entry.ts);
          if(entry.emp) title += ' — '+entry.emp;
        } else if(st==='pending' && isTurnBlocked(t.key)){
          const isDiurno = t.key==='T1D'||t.key==='T2D';
          title = isDiurno
            ? 'Turno diurno — disponível das 07:00 às 19:00'
            : 'Turno noturno — disponível das 19:00 às 07:00';
        } else if(blocked){
          const dl = occDeadline(loc, t.key, i, currentDate);
          const now = Date.now();
          const dlMs = dl ? dl.getTime() : 0;
          const tooEarly = dlMs && now < dlMs - 2*3600000;
          title = tooEarly
            ? `Disponível a partir das ${fmtTime(dlMs - 2*3600000)} — aguarde o horário`
            : 'Prazo encerrado — lançamento não permitido.';
        } else if(overdue){
          const dl = occDeadline(loc, t.key, i, currentDate);
          title = 'Atrasado — deveria ter sido feito até '+fmtTime(dl.getTime());
        }
        const dl = occDeadline(loc, t.key, i, currentDate);
        const dlTime = dl ? fmtTime(dl.getTime()) : '';
        const isBathroom = isBathroomLoc(loc);
        const showTime = isBathroom || !!mealInfo;
        let timeHtml = '';
        if(entry.ts && showTime){
          timeHtml = `<div class="occ-time">${fmtTime(entry.ts)}${entry.emp?'<br>'+entry.emp.split(' ')[0]:''}</div>`;
        } else if(dlTime && showTime){
          const timeColor = blocked ? 'var(--bad)' : overdue ? 'var(--bad)' : 'var(--text-dim)';
          const mealLabel = mealInfo ? `<div class="occ-time" style="font-weight:600;color:${timeColor};">${mealInfo.label}</div>` : '';
          timeHtml = mealLabel + `<div class="occ-time" style="color:${timeColor};${(blocked||overdue)?'font-weight:600;':''}">${dlTime}</div>`;
        }
        html += `<div class="occ-wrap"><div class="occ ${cls}" data-key="${k}" data-blocked="${blocked}" title="${title}">${blocked?'🔒':overdue?'!':stateSymbol(st)}</div>${timeHtml}</div>`;
      }
      html += `</div></div>`;
    });
    html += `</div>`;
  });

  html += `</div>
    <div class="legend">
      <span><span class="dot pending"></span>Pendente</span>
      <span><span class="dot done"></span>Concluído</span>
      <span><span class="dot bad"></span>Não realizado</span>
      <span><span class="dot bad" style="animation:overduePulse 1.4s ease-in-out infinite;"></span>Atrasado (automático)</span>
    </div>
    <div class="legend">Clique numa célula para alternar: pendente → concluído → não realizado.</div>
  `;
  app.innerHTML = html;
  // Restaura a posição de rolagem exatamente onde estava antes do re-render.
  requestAnimationFrame(()=>{ window.scrollTo(0, _scrollY); });

  // contadores por turno
  turns.forEach(t=>{
    let total=0, done=0;
    dayLocations.forEach(loc=>{
      const n = resolveFreq(loc, t.key, currentDate);
      total += n;
      for(let i=0;i<n;i++){
        const k = loc.name+'|'+t.key+'|'+i;
        if(getEntry(data,k).state==='done') done++;
      }
    });
    const elSpan = app.querySelector(`[data-turncount="${t.key}"]`);
    if(elSpan) elSpan.textContent = done+'/'+total;
  });

  // lupa: filtra + autocomplete dropdown
  (function(){
    const input = document.getElementById('locSearch');
    const dd = document.getElementById('locSearchDD');
    if(!input || !dd) return;

    function getLocNames(){
      const names = new Set();
      app.querySelectorAll('.loc-row[data-locname]').forEach(r=>names.add(r.getAttribute('data-locname')));
      return [...names];
    }

    function filterRows(q){
      app.querySelectorAll('.loc-row[data-locname]').forEach(row=>{
        const match = !q || row.getAttribute('data-locname').includes(q);
        row.style.display = match ? '' : 'none';
      });
    }

    function openDD(q){
      const all = getLocNames();
      const filtered = q ? all.filter(n=>n.includes(q)) : all;
      dd.innerHTML = '';
      if(!filtered.length){
        dd.innerHTML = '<div class="lsearch-empty">Nenhum ambiente encontrado</div>';
      } else {
        // Show max 12 suggestions
        filtered.forEach(name=>{
          const div = document.createElement('div');
          div.className = 'lsearch-item';
          // Get display name from loc-row
          const row = app.querySelector(`.loc-row[data-locname="${name}"]`);
          const displayName = row ? (row.querySelector('.loc-name')?.textContent || name) : name;
          div.textContent = displayName;
          div.addEventListener('mousedown', e=>{
            e.preventDefault();
            input.value = displayName;
            filterRows(name);
            dd.classList.remove('open');
            // Scroll to first match
            const target = app.querySelector('.loc-row[data-locname="'+name+'"]');
            if(target) target.scrollIntoView({behavior:'smooth', block:'center'});
          });
          dd.appendChild(div);
        });
      }
      dd.classList.add('open');
    }

    input.addEventListener('focus', ()=>{ openDD(input.value.toLowerCase().trim()); });
    input.addEventListener('input', ()=>{
      const q = input.value.toLowerCase().trim();
      filterRows(q);
      openDD(q);
    });
    input.addEventListener('blur', ()=>{ setTimeout(()=>dd.classList.remove('open'), 200); });
    input.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ input.value=''; filterRows(''); dd.classList.remove('open'); }
    });
    document.addEventListener('click', e=>{ if(!input.contains(e.target)&&!dd.contains(e.target)) dd.classList.remove('open'); });
  })();

  // clique nas ocorrências
  app.querySelectorAll('.occ').forEach(el=>{
    el.addEventListener('click', async ()=>{
      // Bloqueia lançamento retroativo para banheiros após 2h do prazo (admin pode ignorar)
      if(el.getAttribute('data-blocked')==='true' && !isAdmin){
        const key = el.getAttribute('data-key');
        const parts = key.split('|');
        const locName = parts[0];
        const turnKey = parts[1];
        const idx = parseInt(parts[2]);

        // Bloqueio de turno
        if(isTurnBlocked(turnKey)){
          const isDiurno = turnKey==='T1D'||turnKey==='T2D';
          showBlockedAlert('turn', isDiurno ? '07:00' : '19:00');
          return;
        }

        const loc = dayLocations.find(l=>l.name===locName);
        const dl = loc ? occDeadline(loc, turnKey, idx, currentDate) : null;
        const tooEarly = dl && Date.now() < dl.getTime() - 2*3600000;
        showBlockedAlert(tooEarly ? 'early' : 'late', dl ? fmtTime(dl.getTime() - 2*3600000) : '');
        return;
      }
      const k = el.getAttribute('data-key');
      const cur = getEntry(data,k).state;
      const next = cycleState(cur);
      if(next==='pending'){
        delete data[k];
        await saveDay(ds);
        renderDay();
      } else {
        // Busca efetivo do turno/data atual
        const kParts = k.split('|');
        const kTurnKey = kParts[1]; // ex: T1D, T2D, T1N, T2N
        const efData = await loadEfetivo(ds);
        const efLista = (efData[kTurnKey] || []).map(p => p.nome || p).filter(Boolean);

        // Labels dos turnos
        const TMAP = {T1D:'T1 Par (Diurno)',T1N:'T2 Par (Noturno)',T2D:'T1 Ímpar (Diurno)',T2N:'T2 Ímpar (Noturno)'};
        const turnLabel = TMAP[kTurnKey] || kTurnKey;
        const dateLabel = fmtBR(currentDate);

        // Cria modal
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';

        if(!efLista.length){
          overlay.innerHTML = `<div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:420px;width:100%;">
            <div style="font-size:18px;font-weight:700;margin-bottom:12px;">⚠️ Efetivo não cadastrado</div>
            <div style="font-size:13px;color:var(--text-dim);margin-bottom:16px;">
              Não há colaboradores lançados no efetivo para:<br><br>
              <strong>${dateLabel} · ${turnLabel}</strong><br><br>
              Para registrar a realização, acesse a aba <strong>👷 Efetivo</strong> e lance os colaboradores presentes neste turno antes de continuar.
            </div>
            <button id="efModalClose" class="btn secondary" style="width:100%;">Entendido</button>
          </div>`;
          document.body.appendChild(overlay);
          overlay.querySelector('#efModalClose').addEventListener('click', ()=>overlay.remove());
          overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
          return;
        }

        overlay.innerHTML = `<div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:420px;width:100%;">
          <div style="font-size:16px;font-weight:700;margin-bottom:4px;">👤 Responsável pela execução</div>
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:16px;">${dateLabel} · ${turnLabel}</div>
          <select id="efModalSelect" style="width:100%;background:var(--panel-2);border:1px solid var(--teal);color:var(--text);padding:11px 12px;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:16px;">
            <option value="">— Selecione o responsável —</option>
            ${efLista.map(n=>`<option value="${n}">${n}</option>`).join('')}
          </select>
          <div style="display:flex;gap:10px;">
            <button id="efModalOk" class="btn" style="flex:1;">Confirmar</button>
            <button id="efModalCancel" class="btn secondary" style="flex:1;">Cancelar</button>
          </div>
        </div>`;
        document.body.appendChild(overlay);

        overlay.querySelector('#efModalCancel').addEventListener('click', ()=>overlay.remove());
        overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
        overlay.querySelector('#efModalOk').addEventListener('click', async ()=>{
          const sel = overlay.querySelector('#efModalSelect');
          const empName = sel.value;
          if(!empName){ sel.style.borderColor='var(--bad)'; return; }
          overlay.remove();
          await saveEmployee(empName);
          data[k] = {state:next, ts:Date.now(), emp:empName};
          await saveDay(ds);
          renderDay();
        });
        // Focus select
        setTimeout(()=>overlay.querySelector('#efModalSelect').focus(), 50);
      }
    });
  });
}

async function renderWeek(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Carregando semana...</div>';
  const monday = startOfWeek(currentDate);
  const days = [];
  for(let i=0;i<7;i++){ const d=new Date(monday); d.setDate(d.getDate()+i); days.push(d); }
  const dayNames = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  const dataByDay = {};
  for(const d of days){ const ds=dateStr(d); dataByDay[ds] = await loadDay(ds); }

  let html = `<div class="week-title">Semana de ${fmtBR(days[0])} a ${fmtBR(days[6])}</div>
    <div class="tablewrap"><table class="week"><thead><tr><th style="text-align:left">Local</th>`;
  days.forEach(d=>{ html += `<th>${dayNames[d.getDay()]}<br>${pad(d.getDate())}/${pad(d.getMonth()+1)}</th>`; });
  html += `</tr></thead><tbody>`;

  // Monta a lista de linhas (ambientes) a partir da configuração vigente em CADA dia exibido —
  // preserva o histórico caso a semana atravesse a data de implantação (CONFIG_CUTOVER_DATE).
  const weekRowNames = [];
  const weekRowSeen = new Set();
  days.forEach(d=>{
    getLocationsForDate(d).forEach(l=>{
      if(!weekRowSeen.has(l.name)){ weekRowSeen.add(l.name); weekRowNames.push(l.name); }
    });
  });

  weekRowNames.forEach(locName=>{
    html += `<tr><td class="locname">${locName}</td>`;
    days.forEach(d=>{
      const ds = dateStr(d);
      const data = dataByDay[ds];
      const loc = getLocationsForDate(d).find(l=>l.name===locName);
      let total=0, done=0, hasBad=false;
      if(loc){
        TURNS.forEach(t=>{
          const n = resolveFreq(loc, t.key, d);
          total += n;
          for(let i=0;i<n;i++){
            const k = loc.name+'|'+t.key+'|'+i;
            const st = getEntry(data,k).state;
            if(st==='done') done++;
            if(st==='bad') hasBad = true;
          }
        });
      }
      let cls='empty', label='—';
      if(done===total && total>0){cls='full'; label='✓';}
      else if(hasBad){cls='hasbad'; label=done+'/'+total;}
      else if(done>0){cls='partial'; label=done+'/'+total;}
      html += `<td class="daycell" data-date="${ds}"><span class="chip ${cls}">${label}</span></td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div>
    <div class="legend">
      <span><span class="chip full" style="padding:2px 6px;">✓</span> Tudo concluído</span>
      <span><span class="chip partial" style="padding:2px 6px;">n/m</span> Parcial</span>
      <span><span class="chip hasbad" style="padding:2px 6px;">n/m</span> Com não realizado</span>
      <span><span class="chip empty" style="padding:2px 6px;">—</span> Nada registrado</span>
    </div>
    <div class="legend">Clique em qualquer dia da semana para abrir o checklist detalhado.</div>
  `;
  app.innerHTML = html;
  app.querySelectorAll('.daycell').forEach(td=>{
    td.addEventListener('click', ()=>{
      const ds = td.getAttribute('data-date');
      const [y,m,dd] = ds.split('-').map(Number);
      currentDate = new Date(y,m-1,dd);
      mode='day';
      renderTopControls();
      renderChecklist();
    });
  });
}

let reqTab = 'track'; // abre direto em acompanhar

function genTicketId(){
  const d = new Date();
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return 'L'+pad(d.getDate())+pad(d.getMonth()+1)+'-'+rand;
}

/* ---- REQUEST STORAGE: memória primária + storage como backup ---- */
let _requests = []; // array em memória — sempre funciona
let _reqLoaded = false;

let _migrated = false;
async function migrateOldRequestsIfNeeded(){
  if(_migrated) return;
  _migrated = true;
  try{
    const oldSnap = await withTimeout(fbRoot.child('allreqs').get(), 5000);
    if(oldSnap.exists()){
      const newSnap = await withTimeout(fbRequestsRef.get(), 5000);
      if(!newSnap.exists()){
        const arr = JSON.parse(oldSnap.val());
        if(Array.isArray(arr) && arr.length){
          const updates = {};
          arr.forEach(r=>{ if(r && r.id) updates[r.id]=r; });
          await fbRequestsRef.update(updates);
        }
      }
    }
  }catch(e){ console.error('Falha na migração de solicitações antigas', e); }
}

let _reqLoadTs=0;
async function ensureRequestsLoaded(){
  const now=Date.now();
  // Cache de 20s — evita múltiplas chamadas ao Firebase em sequência
  if(_requests.length>0 && (now-_reqLoadTs)<20000) return;
  await migrateOldRequestsIfNeeded();
  try{
    const snap = await withTimeout(fbRequestsRef.get());
    _requests = snap.exists() ? Object.values(snap.val()) : [];
    _reqLoadTs = Date.now();
  }catch(e){ /* mantém dados atuais em memória se a busca falhar */ }
  _reqLoaded = true;
}
async function loadAllRequests(){
  await ensureRequestsLoaded();
  return [..._requests].sort((a,b)=>b.createdAt-a.createdAt);
}
async function saveRequest(id, obj){
  _reqLoadTs=0; // invalida cache ao salvar
  try{
    await fbRequestsRef.child(id).set(obj);
    const idx = _requests.findIndex(r=>r.id===id);
    if(idx>=0) _requests[idx]=obj; else _requests.push(obj);
    return true;
  }catch(e){ console.error('Erro ao salvar solicitação', e); return false; }
}
async function loadRequest(id){
  await ensureRequestsLoaded();
  return _requests.find(r=>r.id===id) || null;
}
async function deleteRequest(id){
  await fbRequestsRef.child(id).remove();
  _requests = _requests.filter(r=>r.id!==id);
}

function fmtDuration(ms){
  const h = Math.floor(ms/3600000);
  const m = Math.round((ms%3600000)/60000);
  if(h===0) return m+'min';
  if(m===0) return h+'h';
  return h+'h '+m+'min';
}

function statusBadge(status){
  if(status==='concluida') return '<span class="badge concluida">Concluída ✓</span>';
  if(status==='excluida')  return '<span class="badge excluida">Excluída</span>';
  if(status==='andamento') return '<span class="badge andamento">Em andamento</span>';
  return '<span class="badge aberta">Pendente</span>';
}
function prioBadge(p){
  return p==='alta' ? '<span class="badge prio-alta">Urgente</span>' : '<span class="badge prio-normal">Normal</span>';
}

function wireReqCard(card, onUpdate){
  const id = card.getAttribute('data-id');
  card.querySelectorAll('.req-photo-thumb').forEach(img=>{
    img.addEventListener('click', ()=> showPhotoLightbox(img.src));
  });
  card.querySelectorAll('[data-action]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const r = await loadRequest(id);
      const action = btn.getAttribute('data-action');
      if(action==='delete'){
        if(!isAdmin){ alert('Ação restrita ao administrador.'); return; }
        if(!confirm('Excluir esta solicitação permanentemente?')) return;
        // Marca como excluída em vez de deletar do Firebase (preserva histórico)
        r.status = 'excluida';
        r.deletedAt = Date.now();
        r.updatedAt = Date.now();
        await saveRequest(id, r);
        onUpdate();
        return;
      }
      if(action==='concluida'){
        if(!r.assignee){
          alert('⚠️ É necessário atribuir um responsável antes de concluir a solicitação.');
          return;
        }
        openCloseModal(r, async (who, evidenciaDataUrl)=>{
          r.status='concluida';
          r.closedAt=Date.now();
          r.closedBy=who.trim();
          r.updatedAt=Date.now();
          if(evidenciaDataUrl) r.evidencia=evidenciaDataUrl;
          await saveRequest(id, r);
          onUpdate();
        });
      } else {
        r.status=action;
        r.updatedAt=Date.now();
        await saveRequest(id, r);
        onUpdate();
      }
    });
  });
  card.querySelectorAll('[data-assign]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const r = await loadRequest(id);
      const name = prompt('Nome do responsável pelo atendimento:', r.assignee||'');
      if(name===null) return;
      r.assignee = name.trim();
      r.assignedAt = Date.now();
      r.updatedAt = Date.now();
      // Ao atribuir responsável, promove automaticamente para "em andamento"
      if(r.status==='aberta') r.status='andamento';
      await saveRequest(id, r);
      onUpdate();
    });
  });
}

    // ── Helpers ──
    const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    // SLA médio — duas variantes:
    // Pendentes: tempo em aberto (agora - createdAt)
    // Concluídas: tempo de resolução (closedAt - createdAt)
    function fmtDurationSla(ms){
      if(ms === null) return null;
      const h = ms/3600000;
      if(h < 1) return Math.round(h*60)+'min';
      if(h < 24) return h.toFixed(1)+'h';
      const d = Math.floor(h/24), hrem = Math.round(h%24);
      return hrem > 0 ? `${d}d ${hrem}h` : `${d}d`;
    }
    function calcSlaContextual(list, subTab){
      const now = Date.now();
      if(subTab === 'pendentes'){
        // Tempo em aberto para pendentes+andamento
        const valid = list.filter(r=>(r.status==='aberta'||r.status==='andamento')&&r.createdAt);
        if(!valid.length) return null;
        const avgMs = valid.reduce((s,r)=>s+(now-r.createdAt),0)/valid.length;
        return fmtDurationSla(avgMs);
      } else {
        // Tempo de resolução para concluídas
        const valid = list.filter(r=>r.status==='concluida'&&r.closedAt&&r.createdAt);
        if(!valid.length) return null;
        const avgMs = valid.reduce((s,r)=>s+(r.closedAt-r.createdAt),0)/valid.length;
        return fmtDurationSla(avgMs);
      }
    }
    function slaLabel(){ return reqSubTab==='pendentes' ? 'SLA médio em aberto' : 'SLA médio de resolução'; }
    function slaMedia(list){
      const valid = list.filter(r=>r.status==='concluida'&&r.closedAt&&r.createdAt);
      if(!valid.length) return null;
      const avgMs = valid.reduce((s,r)=>s+(r.closedAt-r.createdAt),0)/valid.length;
      return fmtDurationSla(avgMs);
    }
    function slaMediaMs(list){
      const valid = list.filter(r=>r.status==='concluida'&&r.closedAt&&r.createdAt);
      if(!valid.length) return null;
      return valid.reduce((s,r)=>s+(r.closedAt-r.createdAt),0)/valid.length;
    }

    // Available months from all requests
    const monthSet = new Set(all.map(r=>{ const d=new Date(r.createdAt); return d.getFullYear()+'-'+(d.getMonth()+1); }));
    const monthOptions = [...monthSet].sort().reverse().map(m=>{
      const [y,mo]=m.split('-'); return `<option value="${m}">${meses[parseInt(mo)-1]} ${y}</option>`;
    }).join('');

    // Get selected month from existing select if any
    const prevMonth = content.querySelector('#filterMonth')?.value || '';

    const excluidas=allRaw.filter(r=>r.status==='excluida');
    const abertas=all.filter(r=>r.status==='aberta');
    const andamento=all.filter(r=>r.status==='andamento');
    const concluidas=all.filter(r=>r.status==='concluida');

    // ── Função centralizada de KPIs ──────────────────────────────────────────
    const SLA_META_MS = 4 * 3600000; // meta: 4h

    function buildKpiHtml(dataset, subTab){
      const now = Date.now();
      const pAbertas   = dataset.filter(r=>r.status==='aberta');
      const pAndamento = dataset.filter(r=>r.status==='andamento');
      const pConcluidas= dataset.filter(r=>r.status==='concluida');
      const semResp    = pAbertas.filter(r=>!r.assignee);
      const urgentes   = dataset.filter(r=>(r.status==='aberta'||r.status==='andamento')&&r.prio==='alta');

      if(subTab === 'andamento'){
        const slaAnd = pAndamento.length
          ? fmtDurationSla(pAndamento.reduce((s,r)=>s+(now-r.createdAt),0)/pAndamento.length)
          : null;
        return `
          <div class="stat-box"><div class="num" style="color:#2563eb;">${pAndamento.length}</div><div class="lbl">Em andamento</div></div>
          <div class="stat-box"><div class="num" style="color:var(--ok);">${pAndamento.filter(r=>r.assignee).length}</div><div class="lbl">Com responsável</div></div>
          <div class="stat-box"><div class="num" style="color:var(--bad);">${pAndamento.filter(r=>!r.assignee).length}</div><div class="lbl">Sem responsável</div></div>
          <div class="stat-box"><div class="num" style="color:var(--teal-bright);">${slaAnd||'—'}</div><div class="lbl">Tempo médio em aberto</div></div>
          <div class="stat-box"><div class="num" style="color:var(--bad);">${pAndamento.filter(r=>r.prio==='alta').length}</div><div class="lbl">Urgentes</div></div>`;
      }
      if(subTab === 'pendentes'){
        // SLA médio em aberto (agora - createdAt) para pendentes+andamento
        const pendAll = [...pAbertas,...pAndamento];
        const slaAberto = pendAll.length
          ? fmtDurationSla(pendAll.reduce((s,r)=>s+(now-r.createdAt),0)/pendAll.length)
          : null;
        return `
          <div class="stat-box">
            <div class="num" style="color:var(--amber)">${pAbertas.length+pAndamento.length}</div>
            <div class="lbl">Não resolvidas</div>
          </div>
          <div class="stat-box">
            <div class="num" style="color:var(--bad)">${semResp.length}</div>
            <div class="lbl">Sem responsável</div>
          </div>
          <div class="stat-box">
            <div class="num" style="color:var(--teal-bright)">${pAndamento.length}</div>
            <div class="lbl">Em andamento</div>
          </div>
          <div class="stat-box" title="Tempo médio desde a abertura até agora.">
            <div class="num" style="color:${slaAberto?'var(--amber)':'var(--text-dim)'}">${slaAberto||'—'}</div>
            <div class="lbl">SLA médio em aberto</div>
          </div>
          <div class="stat-box">
            <div class="num" style="color:var(--bad)">${urgentes.length}</div>
            <div class="lbl">Urgentes</div>
          </div>`;
      } else {
        // Concluídas
        const validCon = pConcluidas.filter(r=>r.closedAt&&r.createdAt);
        const slaResolucao = validCon.length
          ? fmtDurationSla(validCon.reduce((s,r)=>s+(r.closedAt-r.createdAt),0)/validCon.length)
          : null;
        const dentroSla  = pConcluidas.filter(r=>r.closedAt&&r.createdAt&&(r.closedAt-r.createdAt)<=SLA_META_MS).length;
        const foraSla    = pConcluidas.filter(r=>r.closedAt&&r.createdAt&&(r.closedAt-r.createdAt)>SLA_META_MS).length;
        const taxaRes    = dataset.length ? Math.round(pConcluidas.length/dataset.length*100) : 0;
        return `
          <div class="stat-box">
            <div class="num" style="color:var(--ok)">${pConcluidas.length}</div>
            <div class="lbl">Concluídas</div>
          </div>
          <div class="stat-box" title="Tempo médio entre abertura e conclusão.">
            <div class="num" style="color:${slaResolucao?'var(--teal-bright)':'var(--text-dim)'}">${slaResolucao||'—'}</div>
            <div class="lbl">SLA médio de resolução</div>
          </div>
          <div class="stat-box">
            <div class="num" style="color:var(--ok)">${dentroSla}</div>
            <div class="lbl">Dentro do SLA</div>
          </div>
          <div class="stat-box">
            <div class="num" style="color:var(--bad)">${foraSla}</div>
            <div class="lbl">Fora do SLA</div>
          </div>
          <div class="stat-box">
            <div class="num" style="color:var(--teal-bright)">${taxaRes}%</div>
            <div class="lbl">Taxa de resolução</div>
          </div>`;
      }
    }

    function renderMonth(filterVal){
      const filtered = filterVal
        ? all.filter(r=>{ const d=new Date(r.createdAt); return (d.getFullYear()+'-'+(d.getMonth()+1))===filterVal; })
        : all;
      const fAbertas    = filtered.filter(r=>r.status==='aberta');
      const fAndamento  = filtered.filter(r=>r.status==='andamento');
      const fConcluidas = filtered.filter(r=>r.status==='concluida');
      const fSla = calcSlaContextual(filtered, reqSubTab);
      const fTx = filtered.length ? Math.round(fConcluidas.length/filtered.length*100) : 0;

      // Recalcula KPIs contextuais
      const kpisEl = document.getElementById('dash-kpis');
      if(kpisEl) kpisEl.innerHTML = buildKpiHtml(filtered, reqSubTab);
      
      const secAberta = document.getElementById('sec-aberta');
      const secAnd    = document.getElementById('sec-andamento');
      const secCon    = document.getElementById('sec-concluida');

      if(secAberta && reqSubTab==='pendentes'){
        const t=document.getElementById('sec-aberta-title'); if(t) t.textContent=`Pendente — sem responsável (${fAbertas.length})`;
        secAberta.innerHTML = fAbertas.length ? fAbertas.map(r=>reqCardHtml(r,true)).join('') : '<div class="empty-state">Nenhuma solicitação pendente 🎉</div>';
        secAberta.querySelectorAll('.req-card').forEach(card=>wireReqCard(card, renderRequests));
      }
      if(secAnd && (reqSubTab==='pendentes'||reqSubTab==='andamento')){
        const t=document.getElementById('sec-and-title'); if(t) t.textContent=`Em andamento — atribuídas (${fAndamento.length})`;
        secAnd.innerHTML = fAndamento.length ? fAndamento.map(r=>reqCardHtml(r,true)).join('') : '<div class="empty-state">Nenhuma em andamento.</div>';
        secAnd.querySelectorAll('.req-card').forEach(card=>wireReqCard(card, renderRequests));
      }
      if(secCon && reqSubTab==='concluidas'){
        const t=document.getElementById('sec-con-title'); if(t) t.textContent=`Concluídas (${fConcluidas.length})`;
        secCon.innerHTML = fConcluidas.length ? fConcluidas.map(r=>reqCardHtml(r,false)).join('') : '<div class="empty-state">Nenhuma concluída ainda.</div>';
        secCon.querySelectorAll('.req-card').forEach(card=>wireReqCard(card, renderRequests));
      }
    }

    let html=`
      <!-- ── FILTRO DE MÊS ── -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
        <label style="font-size:13px;color:var(--text-dim);font-weight:500;">Filtrar por mês:</label>
        <select id="filterMonth" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;font-size:13px;font-family:inherit;">
          <option value="">Todos os períodos</option>
          ${monthOptions}
        </select>
        <span id="filterLabel" style="font-size:12px;color:var(--text-dim);"></span>
      </div>

      <!-- ── KPIs contextuais por aba ── -->
      <div id="dash-kpis" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px;">
        ${buildKpiHtml(all, reqSubTab)}
      </div>

      <!-- ── BUSCA ── -->
      <div class="search-row" style="margin-bottom:20px;">
        <input type="text" id="trackInput" placeholder="Buscar por código (ex: L3006-A1B2) ou nome do solicitante">
        <button class="btn" id="trackBtn">Buscar</button>
      </div>
      <div id="trackResult"></div>

      <!-- ── LISTAS ── -->
      ${reqSubTab==='pendentes' ? `
      <div id="sec-aberta-title" class="section-title">Pendente — sem responsável (${abertas.length})</div>
      <div id="sec-aberta">
        ${abertas.length ? abertas.map(r=>reqCardHtml(r,true)).join('') : '<div class="empty-state">Nenhuma solicitação pendente 🎉</div>'}
      </div>` : reqSubTab==='andamento' ? `
      <div class="section-title" style="color:#2563eb;">🔄 Em andamento — atribuídas (${andamento.length})</div>
      <div id="sec-andamento">
        ${andamento.length ? andamento.map(r=>reqCardHtml(r,true)).join('') : '<div class="empty-state">Nenhuma solicitação em andamento.</div>'}
      </div>` : `
      <div id="sec-con-title" class="section-title">Concluídas (${concluidas.length})</div>
      <div id="sec-concluida">
        ${concluidas.length ? concluidas.map(r=>reqCardHtml(r,false)).join('') : '<div class="empty-state">Nenhuma concluída ainda.</div>'}
      </div>
      ${isAdmin && excluidas.length ? `
      <div class="section-title" style="margin-top:24px;color:#888;">Excluídas pelo Admin (${excluidas.length})</div>
      <div id="sec-excluida" style="opacity:.6;">
        ${excluidas.map(r=>reqCardHtml(r,false)).join('')}
      </div>` : ''}
      `}
    `;
    content.innerHTML=html;

    // Wire all cards
    content.querySelectorAll('.req-card').forEach(card=>wireReqCard(card, renderRequests));

    // Month filter
    document.getElementById('filterMonth').addEventListener('change', function(){
      renderMonth(this.value);
    });

    // Search
    const doSearch=async()=>{
      const q=document.getElementById('trackInput').value.trim().toLowerCase();
      const resEl=document.getElementById('trackResult');
      if(!q){resEl.innerHTML='';return;}
      resEl.innerHTML='<div class="loading">Buscando...</div>';
      const matches=all.filter(r=>r.id.toLowerCase()===q||r.nome.toLowerCase().includes(q)||r.local.toLowerCase().includes(q));
      if(!matches.length){resEl.innerHTML=`<div class="empty-state">Nenhuma solicitação encontrada para "${q}".</div>`;return;}
      resEl.innerHTML=`<div class="section-title">Resultado da busca (${matches.length})</div>`+matches.map(r=>reqCardHtml(r,true)).join('');
      resEl.querySelectorAll('.req-card').forEach(card=>wireReqCard(card, renderRequests));
    };
    document.getElementById('trackBtn').addEventListener('click', doSearch);
    document.getElementById('trackInput').addEventListener('keydown',(e)=>{if(e.key==='Enter')doSearch();});
  }
}

/* ===================== RENDER REPORT ===================== */
let reportSection = 'checklist'; // 'checklist' | 'requests'

function monthLabel(d){
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return meses[d.getMonth()]+' de '+d.getFullYear();
}
function getDatesForPeriod(){
  if(reportPeriod==='day') return [new Date(reportDate)];
  if(reportPeriod==='week'){
    const monday=startOfWeek(reportDate), arr=[];
    for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(d.getDate()+i);arr.push(d);}
    return arr;
  }
  const y=reportDate.getFullYear(),m=reportDate.getMonth();
  const days=new Date(y,m+1,0).getDate(),arr=[];
  for(let i=1;i<=days;i++) arr.push(new Date(y,m,i));
  return arr;
}
function gaugeSvg(pct){
  const r=56,c=2*Math.PI*r,offset=c-(Math.min(pct,100)/100)*c;
  const color=pct>=GOAL_PCT?'#4caf6e':(pct>=80?'#e3b341':'#d96a5a');
  return `<svg width="140" height="140" viewBox="0 0 140 140">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="#1c3436" stroke-width="14"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="14"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

async function renderReport(){
  // Proteção de rota — redireciona para login se não autenticado
  const _users = await (async()=>{ try{ const s=await window.storage.get('system:users',true); return s?JSON.parse(s.value):[]; }catch(e){return [];} })();
  if(_users.length > 0 && !currentUser){ await renderUserLogin(); return; }

  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="req-tabs" style="margin-bottom:18px;">
      <button id="repSecCL" class="${reportSection==='checklist'?'active':''}">Plano de Limpeza</button>
      <button id="repSecRQ" class="${reportSection==='requests'?'active':''}">Solicitações</button>
    </div>
    <div id="repContent"><div class="loading">Calculando...</div></div>`;

  document.getElementById('repSecCL').onclick=()=>{reportSection='checklist';renderReport();};
  document.getElementById('repSecRQ').onclick=()=>{reportSection='requests';renderReport();};

  if(reportSection==='checklist') await renderReportChecklist();
  else await renderReportRequests();
}

async function renderReportChecklist(){
  const content=document.getElementById('repContent');
  content.innerHTML='<div class="loading">Calculando cumprimento do plano...</div>';
  const dates=getDatesForPeriod();
  const dataByDate={};
  for(const d of dates){const ds=dateStr(d);dataByDate[ds]=await loadDay(ds);}

  // ── Helpers de pontualidade ──────────────────────────────────────────────
  // Reutiliza occDeadline existente para classificar cada chip:
  // NO HORÁRIO:  executado && entry.ts <= deadline
  // COM ATRASO:  executado && entry.ts > deadline && entry.ts <= deadline + 2h
  // NÃO EXEC:    não executado && agora > deadline + 2h  (janela encerrada)
  // PENDENTE:    não executado && ainda dentro da janela
  function classifyOcc(loc, turnKey, idx, date, entry){
    const st = entry.state || 'pending';
    const dl = occDeadline(loc, turnKey, idx, date);
    if(!dl) return st==='done' ? 'ontime' : 'pending';
    const dlMs = dl.getTime();
    const tol = 2*3600000;
    if(st==='done'){
      return entry.ts <= dlMs ? 'ontime' : 'late';
    } else {
      const nowMs = new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'})).getTime();
      // Só considera não-exec se for hoje e janela fechou; para datas passadas sempre não-exec
      const today = new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'}));
      const isToday = date.getDate()===today.getDate()&&date.getMonth()===today.getMonth()&&date.getFullYear()===today.getFullYear();
      if(isToday){
        return nowMs > dlMs+tol ? 'notdone' : 'pending';
      } else {
        return 'notdone'; // data passada sem marcação = não executado
      }
    }
  }
  function emptyAcc(){ return {total:0,ontime:0,late:0,notdone:0,pending:0}; }
  function accPct(a,field){ return a.total?Math.round(a[field]/a.total*100):0; }
  function addToAcc(acc, cls){ acc.total++; if(cls in acc) acc[cls]++; }

  // ── Acumuladores ─────────────────────────────────────────────────────────
  const globalAcc = emptyAcc();
  const turnAcc = {}; TURNS.forEach(t=>turnAcc[t.key]=emptyAcc());
  const dailyRows = [];

  dates.forEach(d=>{
    const ds=dateStr(d), data=dataByDate[ds];
    // Para modo DIA: usar só turnos ativos do dia
    const turnsForDay = reportPeriod==='day' ? activeTurns(d) : TURNS;
    const dayAcc = emptyAcc();
    const perTurnDay = {};
    turnsForDay.forEach(t=>{ perTurnDay[t.key]=emptyAcc(); });

    // Usa a configuração de ambientes/frequências vigente NA DATA "d" (getLocationsForDate),
    // e não a configuração atual — protege os indicadores de períodos já fechados.
    getLocationsForDate(d).forEach(loc=>{
      turnsForDay.forEach(t=>{
        const n=resolveFreq(loc,t.key,d);
        for(let i=0;i<n;i++){
          const k=loc.name+'|'+t.key+'|'+i;
          const entry=getEntry(data,k);
          const cls=classifyOcc(loc,t.key,i,d,entry);
          addToAcc(globalAcc,cls);
          addToAcc(dayAcc,cls);
          addToAcc(turnAcc[t.key],cls);
          addToAcc(perTurnDay[t.key],cls);
        }
      });
    });
    dailyRows.push({d, acc:dayAcc, perTurn:perTurnDay, turns:turnsForDay});
  });

  // ── Labels e cores ───────────────────────────────────────────────────────
  const overallPct = globalAcc.total ? Math.round((globalAcc.ontime+globalAcc.late)/globalAcc.total*100) : 0;
  const ontimePct  = accPct(globalAcc,'ontime');
  const latePct    = accPct(globalAcc,'late');
  const notdonePct = accPct(globalAcc,'notdone');
  const meetsGoal  = overallPct >= GOAL_PCT;
  const gap        = GOAL_PCT - overallPct;

  let periodLabel='';
  if(reportPeriod==='day'){
    const isPar = reportDate.getDate()%2===0;
    const turnLabels = activeTurns(reportDate).map(t=>t.label).join(' · ');
    periodLabel=`${fmtBR(reportDate)} <span style="font-size:12px;color:var(--text-dim);font-weight:400;">— Turnos previstos: ${turnLabels}</span>`;
  } else if(reportPeriod==='week'){
    const monday=startOfWeek(reportDate),sunday=new Date(monday);sunday.setDate(sunday.getDate()+6);
    periodLabel='Semana de '+fmtBR(monday)+' a '+fmtBR(sunday);
  } else periodLabel=monthLabel(reportDate);

  function pctColor(p){ return p===null?'var(--text-dim)':p>=GOAL_PCT?'var(--ok)':'var(--bad)'; }
  function pctLabel(p){ return p===null?'—':p+'%'; }

  // ── HTML ─────────────────────────────────────────────────────────────────
  let html=`
    <div class="goal-card">
      <div class="gauge">${gaugeSvg(overallPct)}<div class="gauge-value"><div class="pct">${overallPct}%</div><div class="lbl">Cumprimento</div></div></div>
      <div class="goal-info">
        <h3>${periodLabel}</h3>
        <p>Meta: <strong>${GOAL_PCT}%</strong>. Executadas <strong>${globalAcc.ontime+globalAcc.late}</strong> de <strong>${globalAcc.total}</strong> atividades previstas no plano.</p>
        <span class="status-pill ${meetsGoal?'ok':'warn'}">${meetsGoal?'Meta atingida ✓':`Abaixo da meta (faltam ${gap}p.p.)`}</span>
      </div>
    </div>

    <!-- KPIs de pontualidade -->
    <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:20px;">
      <div class="stat-box">
        <div class="num">${globalAcc.total}</div>
        <div class="lbl">Planejadas</div>
      </div>
      <div class="stat-box">
        <div class="num" style="color:var(--ok);">${globalAcc.ontime}</div>
        <div class="lbl">No horário</div>
        <div style="font-size:12px;color:var(--ok);margin-top:2px;">${ontimePct}%</div>
      </div>
      <div class="stat-box">
        <div class="num" style="color:var(--amber);">${globalAcc.late}</div>
        <div class="lbl">Com atraso</div>
        <div style="font-size:12px;color:var(--amber);margin-top:2px;">${latePct}%</div>
      </div>
      <div class="stat-box">
        <div class="num" style="color:var(--bad);">${globalAcc.notdone}</div>
        <div class="lbl">Não executadas</div>
        <div style="font-size:12px;color:var(--bad);margin-top:2px;">${notdonePct}%</div>
      </div>
      ${globalAcc.pending>0?`<div class="stat-box"><div class="num" style="color:var(--text-dim);">${globalAcc.pending}</div><div class="lbl">Em andamento</div></div>`:''}
    </div>`;

  // ── Detalhamento por turno ────────────────────────────────────────────────
  const colOrder=[
    {key:'T1D', label:'T1 Par',   color:'#3fd6c9'},
    {key:'T1N', label:'T2 Par',   color:'#3fd6c9'},
    {key:'T2D', label:'T1 Ímpar', color:'#a78bfa'},
    {key:'T2N', label:'T2 Ímpar', color:'#a78bfa'},
  ];
  // No modo dia, mostrar só os turnos do dia selecionado
  const colsToShow = reportPeriod==='day'
    ? colOrder.filter(c=>activeTurns(reportDate).some(t=>t.key===c.key))
    : colOrder;

  html+=`<div class="section-title">Detalhamento por turno — Cumprimento do Plano</div>
    <div class="turn-breakdown" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));">`;

  colsToShow.forEach(col=>{
    const a=turnAcc[col.key];
    if(!a||a.total===0) return;
    const execPct=a.total?Math.round((a.ontime+a.late)/a.total*100):0;
    const pontPct=a.total?Math.round(a.ontime/a.total*100):0;
    html+=`<div class="turn-mini" style="border-left:3px solid ${col.color};">
      <div class="tlabel" style="color:${col.color};margin-bottom:10px;">${col.label}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;">
        <div><div style="font-size:18px;font-weight:700;color:var(--text);">${a.total}</div><div style="color:var(--text-dim);">Planejadas</div></div>
        <div><div style="font-size:18px;font-weight:700;color:var(--ok);">${a.ontime}</div><div style="color:var(--ok);">No horário</div></div>
        <div><div style="font-size:18px;font-weight:700;color:var(--amber);">${a.late}</div><div style="color:var(--amber);">Com atraso</div></div>
        <div><div style="font-size:18px;font-weight:700;color:var(--bad);">${a.notdone}</div><div style="color:var(--bad);">Não exec.</div></div>
      </div>
      <div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;font-size:12px;">
        <span>Cumprimento: <strong style="color:${execPct>=GOAL_PCT?'var(--ok)':'var(--bad)'};">${execPct}%</strong></span>
        <span>Pontualidade: <strong style="color:${pontPct>=GOAL_PCT?'var(--ok)':'var(--amber)'};">${pontPct}%</strong></span>
      </div>
    </div>`;
  });
  html+=`</div>`;

  // ── Tabela diária (semana/mês) ────────────────────────────────────────────
  if(reportPeriod!=='day'){
    const dayNames=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    html+=`<div class="section-title">Detalhamento diário</div>
      <div class="tablewrap"><table class="report-table"><thead><tr>
        <th>Data</th><th>Turnos</th>
        <th class="num">Plan.</th>
        <th class="num" style="color:var(--ok);">No horário</th>
        <th class="num" style="color:var(--amber);">C/ atraso</th>
        <th class="num" style="color:var(--bad);">Não exec.</th>
        <th class="num">Cumprimento</th>
        <th class="num">Pontualidade</th>
      </tr></thead><tbody>`;
    dailyRows.forEach(r=>{
      const a=r.acc;
      const execP=a.total?Math.round((a.ontime+a.late)/a.total*100):null;
      const pontP=a.total?Math.round(a.ontime/a.total*100):null;
      const dow=dayNames[r.d.getDay()];
      const turnLabel=r.turns.map(t=>t.label).join(', ');
      html+=`<tr>
        <td style="white-space:nowrap;">${dow} ${fmtBR(r.d)}</td>
        <td style="font-size:11px;color:var(--text-dim);">${turnLabel}</td>
        <td class="num">${a.total}</td>
        <td class="num" style="color:var(--ok);">${a.ontime}</td>
        <td class="num" style="color:var(--amber);">${a.late}</td>
        <td class="num" style="color:var(--bad);">${a.notdone}</td>
        <td class="num" style="color:${pctColor(execP)};font-weight:700;">${pctLabel(execP)}</td>
        <td class="num" style="color:${pctColor(pontP)};font-weight:700;">${pctLabel(pontP)}</td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;
  } else {
    // Modo DIA: card por turno com pontualidade detalhada
    const r=dailyRows[0];
    if(r){
      html+=`<div class="section-title">Detalhamento do dia — ${fmtBR(r.d)}</div>
        <div class="turn-breakdown" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));">`;
      r.turns.forEach(t=>{
        const a=r.perTurn[t.key]||emptyAcc();
        if(a.total===0) return;
        const col=colOrder.find(c=>c.key===t.key);
        const execPct=a.total?Math.round((a.ontime+a.late)/a.total*100):0;
        const pontPct=a.total?Math.round(a.ontime/a.total*100):0;
        html+=`<div class="turn-mini" style="border-left:3px solid ${col?.color||'var(--teal)'};">
          <div class="tlabel" style="color:${col?.color||'var(--teal)'};margin-bottom:10px;">${t.label}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;">
            <div><div style="font-size:18px;font-weight:700;color:var(--text);">${a.total}</div><div style="color:var(--text-dim);">Planejadas</div></div>
            <div><div style="font-size:18px;font-weight:700;color:var(--ok);">${a.ontime}</div><div style="color:var(--ok);">No horário</div></div>
            <div><div style="font-size:18px;font-weight:700;color:var(--amber);">${a.late}</div><div style="color:var(--amber);">Com atraso</div></div>
            <div><div style="font-size:18px;font-weight:700;color:var(--bad);">${a.notdone}</div><div style="color:var(--bad);">Não exec.</div></div>
          </div>
          <div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;font-size:12px;">
            <span>Cumprimento: <strong style="color:${execPct>=GOAL_PCT?'var(--ok)':'var(--bad)'};">${execPct}%</strong></span>
            <span>Pontualidade: <strong style="color:${pontPct>=GOAL_PCT?'var(--ok)':'var(--amber)'};">${pontPct}%</strong></span>
          </div>
        </div>`;
      });
      html+=`</div>`;
    }
  }

  // ── Filtros da tabela detalhada ─────────────────────────────────────────
  html += `
    <div class="section-title" style="margin-top:24px;">Tabela detalhada — drill-down operacional</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;">
      <div style="font-size:12px;font-weight:600;color:var(--text-dim);width:100%;margin-bottom:4px;">Filtros da tabela:</div>
      <div style="display:flex;flex-direction:column;gap:3px;">
        <label style="font-size:11px;color:var(--text-dim);">Turno</label>
        <select id="dtFilterTurn" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:5px 8px;border-radius:6px;font-size:12px;font-family:inherit;">
          <option value="">Todos</option>
          ${colsToShow.map(col=>`<option value="${col.key}">${col.label}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;">
        <label style="font-size:11px;color:var(--text-dim);">Status</label>
        <select id="dtFilterStatus" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:5px 8px;border-radius:6px;font-size:12px;font-family:inherit;">
          <option value="">Todos</option>
          <option value="ontime">No horário</option>
          <option value="late">Com atraso</option>
          <option value="notdone">Não executado</option>
          <option value="pending">Pendente</option>
        </select>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;">
        <label style="font-size:11px;color:var(--text-dim);">Local</label>
        <input type="text" id="dtFilterLocal" placeholder="Filtrar local..." style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:5px 8px;border-radius:6px;font-size:12px;font-family:inherit;width:160px;">
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;">
        <label style="font-size:11px;color:var(--text-dim);">Executor</label>
        <input type="text" id="dtFilterExec" placeholder="Filtrar executor..." style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:5px 8px;border-radius:6px;font-size:12px;font-family:inherit;width:140px;">
      </div>
      <button id="dtApply" class="btn small" style="align-self:flex-end;">Aplicar</button>
      <button id="dtClear" class="btn small secondary" style="align-self:flex-end;">Limpar</button>
      <button id="dtExport" class="btn small secondary" style="align-self:flex-end;margin-left:auto;">⬇ Exportar CSV</button>
    </div>
    <div id="dtTableWrap"></div>
  `;

  content.innerHTML=html;

  // ── Monta registros detalhados ────────────────────────────────────────────
  function buildDetailRows(fTurn, fStatus, fLocal, fExec){
    const rows = [];
    dates.forEach(d=>{
      const ds = dateStr(d);
      const data = dataByDate[ds];
      const turnsForDay = reportPeriod==='day' ? activeTurns(d) : activeTurns(d); // sempre usa turnos do dia
      const dayNames2=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
      turnsForDay.forEach(t=>{
        if(fTurn && t.key!==fTurn) return;
        const col = [{key:'T1D',label:'T1 Par'},{key:'T1N',label:'T2 Par'},{key:'T2D',label:'T1 Ímpar'},{key:'T2N',label:'T2 Ímpar'}].find(x=>x.key===t.key);
        // Configuração vigente na data "d" — protege o detalhamento de períodos já fechados.
        getLocationsForDate(d).forEach(loc=>{
          if(fLocal && !loc.name.toLowerCase().includes(fLocal.toLowerCase())) return;
          const n = resolveFreq(loc,t.key,d);
          for(let i=0;i<n;i++){
            const k = loc.name+'|'+t.key+'|'+i;
            const entry = getEntry(data,k);
            const cls = classifyOcc(loc,t.key,i,d,entry);
            if(fStatus && cls!==fStatus) return;
            const exec = entry.ts ? (entry.emp||'—') : '—';
            if(fExec && exec!=='—' && !exec.toLowerCase().includes(fExec.toLowerCase())) return;
            if(fExec && exec==='—') return;
            const dl = occDeadline(loc,t.key,i,d);
            rows.push({
              data: dayNames2[d.getDay()]+' '+fmtBR(d),
              turno: col?.label||t.label,
              local: loc.name,
              planejado: dl ? fmtTime(dl.getTime()) : '—',
              limite: dl ? fmtTime(dl.getTime()+2*3600000) : '—',
              executado: entry.ts ? fmtTime(entry.ts) : '—',
              executor: exec,
              status: cls,
            });
          }
        });
      });
    });
    return rows;
  }

  const statusLabel = {ontime:'No horário', late:'Com atraso', notdone:'Não executado', pending:'Pendente'};
  const statusColor = {ontime:'var(--ok)', late:'var(--amber)', notdone:'var(--bad)', pending:'var(--text-dim)'};

  function renderDetailTable(rows){
    const wrap = document.getElementById('dtTableWrap');
    if(!rows.length){ wrap.innerHTML='<div class="empty-state">Nenhum registro para os filtros selecionados.</div>'; return; }
    wrap.innerHTML=`<div class="tablewrap"><table class="report-table">
      <thead><tr>
        <th>Data</th><th>Turno</th><th>Local</th>
        <th class="num">Planejado</th><th class="num">Limite</th><th class="num">Executado</th>
        <th>Executor</th><th>Status</th>
      </tr></thead><tbody>
      ${rows.map(r=>`<tr>
        <td style="white-space:nowrap;">${r.data}</td>
        <td>${r.turno}</td>
        <td>${r.local}</td>
        <td class="num" style="font-family:monospace;">${r.planejado}</td>
        <td class="num" style="font-family:monospace;">${r.limite}</td>
        <td class="num" style="font-family:monospace;color:${r.executado!=='—'?'var(--teal-bright)':'var(--text-dim)'};">${r.executado}</td>
        <td style="color:${r.executor!=='—'?'var(--text)':'var(--text-dim)'};">${r.executor}</td>
        <td><span style="color:${statusColor[r.status]};font-weight:600;font-size:12px;">${statusLabel[r.status]||r.status}</span></td>
      </tr>`).join('')}
      </tbody></table></div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:8px;">${rows.length} registro(s) encontrado(s)</div>`;
  }

  // Renderiza tabela inicial com todos os registros
  let currentRows = buildDetailRows('','','','');
  renderDetailTable(currentRows);

  // Wire filtros
  document.getElementById('dtApply').addEventListener('click', ()=>{
    const fTurn   = document.getElementById('dtFilterTurn').value;
    const fStatus = document.getElementById('dtFilterStatus').value;
    const fLocal  = document.getElementById('dtFilterLocal').value.trim();
    const fExec   = document.getElementById('dtFilterExec').value.trim();
    currentRows = buildDetailRows(fTurn, fStatus, fLocal, fExec);
    renderDetailTable(currentRows);
  });

  document.getElementById('dtClear').addEventListener('click', ()=>{
    document.getElementById('dtFilterTurn').value='';
    document.getElementById('dtFilterStatus').value='';
    document.getElementById('dtFilterLocal').value='';
    document.getElementById('dtFilterExec').value='';
    currentRows = buildDetailRows('','','','');
    renderDetailTable(currentRows);
  });

  // Exportar CSV respeitando filtros aplicados
  document.getElementById('dtExport').addEventListener('click', ()=>{
    const header = ['Data','Turno','Local','Planejado','Limite','Executado','Executor','Status'];
    const rows = currentRows.map(r=>[r.data,r.turno,r.local,r.planejado,r.limite,r.executado,r.executor,statusLabel[r.status]||r.status]);
    const csv = [header,...rows].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url;
    a.download='checklist_'+dateStr(reportDate||new Date())+'.csv';
    a.click(); URL.revokeObjectURL(url);
  });
}

async function renderReportRequests(){
  const content=document.getElementById('repContent');
  content.innerHTML='<div class="loading">Carregando solicitações...</div>';
  const allRaw=await loadAllRequests();
  const all=allRaw.filter(r=>r.status!=='excluida'); // exclui dos indicadores

  // Globais (todos os períodos)
  const abertas=all.filter(r=>r.status==='aberta');
  const andamento=all.filter(r=>r.status==='andamento');
  const concluidas=all.filter(r=>r.status==='concluida');
  const naoResolvidas=all.filter(r=>r.status!=='concluida'); // pendentes + andamento
  const taxaResGeral=all.length?Math.round(concluidas.length/all.length*100):0;

  // Período selecionado
  const dates=getDatesForPeriod();
  const startTs=new Date(dates[0]).setHours(0,0,0,0);
  const endTs=new Date(dates[dates.length-1]).setHours(23,59,59,999);
  const inPeriod=r=>r.createdAt>=startTs && r.createdAt<=endTs;
  const allPeriod=all.filter(inPeriod);
  const conPer=allPeriod.filter(r=>r.status==='concluida');
  const naoResPer=allPeriod.filter(r=>r.status!=='concluida');
  const taxaRes=allPeriod.length?Math.round(conPer.length/allPeriod.length*100):0;

  // SLA médio (abertura → conclusão) em horas
  function calcSla(list){
    const valid=list.filter(r=>r.closedAt&&r.createdAt);
    if(!valid.length) return null;
    const avg=valid.reduce((s,r)=>s+(r.closedAt-r.createdAt),0)/valid.length;
    const h=avg/3600000;
    return h<1?Math.round(h*60)+'min':h<24?h.toFixed(1)+'h':(h/24).toFixed(1)+'d';
  }
  const slaGeral=calcSla(concluidas);
  const slaPer=calcSla(conPer);

  // Breakdown por tipo de ocorrência
  const tiposGeral={};
  all.forEach(r=>{ const t=r.tipo||'Não informado'; tiposGeral[t]=(tiposGeral[t]||0)+1; });
  const tiposPer={};
  allPeriod.forEach(r=>{ const t=r.tipo||'Não informado'; tiposPer[t]=(tiposPer[t]||0)+1; });

  // Meses disponíveis para filtro
  const monthSet=new Set(allRaw.filter(r=>r.status!=='excluida').map(r=>{ const d=new Date(r.createdAt); return d.getFullYear()+'-'+(d.getMonth()+1); }));
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const monthOptions=[...monthSet].sort().reverse().map(m=>{ const [y,mo]=m.split('-'); return `<option value="${m}">${meses[parseInt(mo)-1]} ${y}</option>`; }).join('');

  // Tipos para filtro — garante que o value bate exatamente com r.tipo
  const tiposUnicos = [...new Set(all.map(r=>r.tipo||'Não informado'))].sort();
  const tipoOptions = `<option value="">Todos os tipos</option>` + tiposUnicos.map(t=>`<option value="${t}">${t}</option>`).join('');

  let periodLabel='';
  if(reportPeriod==='day') periodLabel=fmtBR(reportDate);
  else if(reportPeriod==='week'){
    const monday=startOfWeek(reportDate),sunday=new Date(monday);sunday.setDate(sunday.getDate()+6);
    periodLabel='Semana '+fmtBR(monday)+' a '+fmtBR(sunday);
  } else periodLabel=monthLabel(reportDate);

  function reqRow(r){
    const bg=r.status==='aberta'?'background:rgba(227,179,65,.06);':r.status==='andamento'?'background:rgba(63,214,201,.06);':'';
    return `<tr style="${bg}">
      <td style="white-space:nowrap;"><span class="req-id">#${r.id}</span></td>
      <td>${r.local}</td>
      <td>${r.tipo||'—'}</td>
      <td>${r.nome}</td>
      <td>${r.prio==='alta'?'<span class="badge prio-alta">Urgente</span>':'<span class="badge prio-normal">Normal</span>'}</td>
      <td>${r.assignee||r.closedBy||'<span style="color:var(--text-dim)">—</span>'}</td>
      <td>${statusBadge(r.status)}</td>
      <td style="white-space:nowrap;">${fmtBRTime(new Date(r.createdAt))}</td>
      <td style="white-space:nowrap;">${r.closedAt?fmtBRTime(new Date(r.closedAt)):'<span style="color:var(--text-dim)">—</span>'}</td>
    </tr>`;
  }
  const tableHead=`<div class="tablewrap"><table class="report-table"><thead><tr>
    <th>Código</th><th>Local</th><th>Tipo</th><th>Solicitante</th><th>Prioridade</th><th>Responsável</th><th>Status</th><th>Registrada em</th><th>Concluída em</th>
  </tr></thead><tbody>`;

    <!-- ===== CONSOLIDADO GERAL ===== -->

      <div class="stat-box"><div class="num" style="color:${slaGeral?'var(--teal-bright)':'var(--text-dim)'}">${slaGeral||'—'}</div><div class="lbl">SLA médio ⓘ</div></div>
      <div class="stat-box"><div class="num">${all.length}</div><div class="lbl">Total geral</div></div>

    <!-- ===== BREAKDOWN POR TIPO ===== -->

      ${Object.entries(tiposGeral).sort((a,b)=>b[1]-a[1]).map(([tipo,qtd])=>{

  if(!naoResolvidas.length){
