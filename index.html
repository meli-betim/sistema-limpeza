<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema de Limpeza — Mercado Livre Betim</title>
<style>
  :root{
    --bg:#0f1b1c;
    --panel:#15282a;
    --panel-2:#1c3436;
    --line:#2a4547;
    --teal:#1f8a8c;
    --teal-bright:#3fd6c9;
    --text:#e8f3f2;
    --text-dim:#8fb0ae;
    --ok:#4caf6e;
    --bad:#d96a5a;
    --pending:#3a5557;
    --amber:#e3b341;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased;}

  .topbar{
    background:linear-gradient(90deg,var(--teal) 0%, #156567 100%);
    padding:14px 24px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  }
  .topbar h1{margin:0;font-size:18px;font-weight:600;}
  .topbar .sub{font-size:12px;color:#d7f3ef;opacity:.85;margin-top:2px;}

  .mainnav{
    display:flex;gap:4px;background:var(--panel);border-bottom:1px solid var(--line);
    padding:0 24px;
  }
  .mainnav button{
    background:transparent;border:none;color:var(--text-dim);padding:13px 18px;
    font-size:13.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;
  }
  .mainnav button.active{color:var(--teal-bright);border-bottom-color:var(--teal-bright);}

  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .seg{display:flex;background:rgba(0,0,0,.25);border-radius:8px;padding:3px;}
  .seg button{border:none;background:transparent;color:#cfeae7;padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600;}
  .seg button.active{background:var(--bg);color:var(--teal-bright);}
  input[type=date]{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.2);color:var(--text);padding:7px 10px;border-radius:6px;font-size:13px;}
  .nav-btn{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.2);color:var(--text);width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:15px;}

  .wrap{padding:20px 24px 60px;max-width:1180px;margin:0 auto;}
  /* Modo quiosque — ocupa tela toda no mobile */
  body.kiosk, body.kiosk * { box-sizing: border-box; }
  body.kiosk .wrap { max-width:100% !important; width:100% !important; padding:0 !important; margin:0 !important; }
  body.kiosk #app { width:100% !important; max-width:100% !important; padding:16px !important; margin:0 !important; }
  body.kiosk .topbar, body.kiosk .mainnav { display:none !important; }
  body.kiosk input:not(.loc-ac-input):not([type=hidden]):not(#kLocalSearch):not(#reqLocalSearch), body.kiosk select, body.kiosk textarea { font-size:16px !important; padding:14px 12px !important; width:100% !important; }
  body.kiosk #kLocalSearch, body.kiosk #reqLocalSearch { font-size:16px !important; padding:12px 12px 12px 38px !important; width:100% !important; }
  body.kiosk label { font-size:15px !important; margin-bottom:6px !important; display:block; }
  body.kiosk .btn { font-size:16px !important; padding:16px !important; width:100% !important; }
  body.kiosk .card { border-radius:12px; margin:0; overflow:visible; }
  body.kiosk .form-row { margin-bottom:16px; }

  /* shared */
  .progress-bar-outer{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:16px;}
  .progress-bar-outer .label{font-size:13px;color:var(--text-dim);min-width:170px;}
  .progress-track{flex:1;height:10px;background:var(--panel-2);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-bright));transition:width .25s ease;}
  .progress-pct{font-size:14px;font-weight:700;color:var(--teal-bright);min-width:48px;text-align:right;}

  .turn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;}
  .turn-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .turn-head{background:var(--panel-2);padding:11px 16px;font-size:13px;font-weight:700;letter-spacing:.4px;color:var(--teal-bright);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);}
  .turn-head span.count{color:var(--text-dim);font-weight:500;font-size:12px;}
  .loc-row{padding:10px 16px;border-bottom:1px solid var(--line);}
  .loc-row:last-child{border-bottom:none;}
  .loc-name{font-size:13.5px;font-weight:600;margin-bottom:6px;}
  .occ-list{display:flex;gap:6px;flex-wrap:wrap;}
  .occ-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .occ-time{font-size:9px;color:var(--text-dim);font-family:monospace;text-align:center;line-height:1.2;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .occ{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--pending);color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;user-select:none;font-weight:700;}
  .occ:active{transform:scale(.9);}
  .occ.done{background:var(--ok);border-color:var(--ok);color:#06210f;}
  .occ.bad{background:var(--bad);border-color:var(--bad);color:#2b0805;}
  .occ.overdue{background:var(--bad);border-color:var(--bad);color:#fff;animation:overduePulse 1.4s ease-in-out infinite;}
  .occ.blocked-late{background:#3a3a3a;border-color:#555;color:#777;cursor:not-allowed;animation:none;font-size:13px;}
  #navAdmin{background:transparent;border:1px solid rgba(227,179,65,.4);color:#e3b341;font-size:12.5px;padding:5px 12px;border-radius:20px;cursor:pointer;transition:background .2s;}
  #navAdmin:hover{background:rgba(227,179,65,.15);}
  #navAdmin.active{background:#e3b341;color:#000;}
    /* Autocomplete de local */
  .loc-ac-wrap { position: relative; width: 100%; }
  .loc-ac-input {
    width: 100%;
    padding: 10px 36px 10px 12px !important;
    background: var(--panel-2);
    border: 1.5px solid var(--teal);
    color: var(--text);
    border-radius: 8px;
    font-size: 15px !important;
    font-family: inherit;
    box-sizing: border-box;
    display: block;
  }
  .loc-ac-input::placeholder { color: var(--text-dim); }
  .loc-ac-input:focus { outline: none; border-color: var(--teal-bright); box-shadow: 0 0 0 2px rgba(31,138,140,.2); }
  .loc-ac-icon {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    font-size: 14px; color: var(--text-dim); pointer-events: none;
  }
  .loc-ac-dropdown {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 2000;
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
    display: none;
  }
  .loc-ac-dropdown.open { display: block; }
  .loc-ac-item {
    padding: 11px 14px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    transition: background .1s;
  }
  .loc-ac-item:last-child { border-bottom: none; }
  .loc-ac-item:hover, .loc-ac-item.highlighted { background: var(--panel-2); color: var(--teal-bright); }
  .loc-ac-item.highlighted { font-weight: 600; }
  .loc-ac-empty { padding: 14px; font-size: 13px; color: var(--text-dim); text-align: center; }
  /* Autocomplete checklist search */
  .lsearch-wrap { position:relative; flex:1; max-width:400px; z-index:100; }
  .lsearch-dd {
    display:none; position:absolute; top:calc(100% + 4px); left:0; right:0;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    max-height:260px; overflow-y:auto; z-index:9999;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    -webkit-overflow-scrolling:touch;
  }
  .lsearch-dd.open { display:block; }
  .lsearch-item {
    padding:14px 14px; font-size:15px; color:var(--text);
    cursor:pointer; border-bottom:1px solid var(--line);
    transition:background .1s;
    -webkit-tap-highlight-color:rgba(0,0,0,0);
    min-height:48px; display:flex; align-items:center;
  }
  .lsearch-item:last-child { border-bottom:none; }
  .lsearch-item:hover, .lsearch-item.hi { background:var(--panel-2); color:var(--teal-bright); }
  .lsearch-empty { padding:12px 14px; font-size:13px; color:var(--text-dim); text-align:center; }
  /* Modo checklist mobile */
  body.checklist-mode .topbar { height:56px; padding:0 16px; }
  body.checklist-mode .topbar h1 { font-size:14px; }
  body.checklist-mode .topbar .sub { display:none; }
  body.checklist-mode .mainnav { display:none !important; }
  body.checklist-mode .wrap { padding:12px 12px 60px; }
  body.checklist-mode .turn-head { padding:10px 14px; }
  body.checklist-mode .turn-head .tname { font-size:13px; }
  body.checklist-mode .loc-row { padding:10px 14px; }
  body.checklist-mode .loc-name { font-size:13px; }
  body.checklist-mode .occ { width:40px; height:40px; font-size:14px; }
  body.checklist-mode .occ-time { font-size:10px; }
  body.checklist-mode .turn-grid { grid-template-columns:1fr; gap:12px; }
  #blockedAlertBanner{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e1e2e;border:1px solid var(--bad);color:var(--text);padding:14px 22px;border-radius:12px;font-size:13.5px;z-index:9999;box-shadow:0 4px 24px rgba(0,0,0,.6);max-width:420px;text-align:center;line-height:1.5;}
  @keyframes overduePulse{0%,100%{box-shadow:0 0 0 0 rgba(217,106,90,.55);}50%{box-shadow:0 0 0 5px rgba(217,106,90,0);}}
  .req-photo-thumb{max-width:160px;max-height:160px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block;margin-top:8px;object-fit:cover;}
  .foto-preview-thumb{max-width:140px;max-height:140px;border-radius:8px;border:1px solid var(--line);object-fit:cover;}

  table.week{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  table.week th, table.week td{padding:10px 10px;font-size:12.5px;border-bottom:1px solid var(--line);text-align:center;}
  table.week th{background:var(--panel-2);color:var(--teal-bright);font-weight:700;}
  table.week td.locname{text-align:left;font-weight:600;white-space:nowrap;}
  table.week td.daycell{cursor:pointer;}
  .chip{display:inline-block;min-width:42px;padding:4px 6px;border-radius:6px;font-weight:700;}
  .chip.full{background:rgba(76,175,110,.18);color:var(--ok);}
  .chip.partial{background:rgba(227,179,65,.18);color:var(--amber);}
  .chip.empty{background:rgba(255,255,255,.05);color:var(--text-dim);}
  .chip.hasbad{background:rgba(217,106,90,.18);color:var(--bad);}

  .legend{display:flex;gap:18px;font-size:12px;color:var(--text-dim);margin:14px 2px 0;flex-wrap:wrap;}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle;}
  .dot.done{background:var(--ok);} .dot.bad{background:var(--bad);} .dot.pending{background:var(--pending);}
  .week-title{font-size:14px;color:var(--text-dim);margin-bottom:10px;}
  .loading{padding:40px;text-align:center;color:var(--text-dim);}
  .tablewrap{overflow-x:auto;border-radius:12px;}

  /* requests */
  .req-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .req-tabs button{background:var(--panel);border:1px solid var(--line);color:var(--text-dim);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .req-tabs button.active{background:var(--teal);color:#06211f;border-color:var(--teal);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;overflow:visible;}
  .form-row{margin-bottom:14px;display:flex;flex-direction:column;gap:6px;}
  .form-row label{font-size:12.5px;color:var(--text-dim);font-weight:600;}
  .form-row input, .form-row select, .form-row textarea{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;font-family:inherit;
  }
  .form-row textarea{resize:vertical;min-height:70px;}
  .btn{background:var(--teal);color:#06211f;border:none;padding:11px 20px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;}
  .btn:hover{background:var(--teal-bright);}
  .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn.small{padding:7px 12px;font-size:12.5px;}

  .ticket-success{background:rgba(63,214,201,.12);border:1px solid var(--teal);border-radius:10px;padding:16px;margin-top:14px;}
  .ticket-code{font-size:22px;font-weight:800;color:var(--teal-bright);letter-spacing:1px;}

  .req-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
  .req-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .req-id{font-size:11px;color:var(--text-dim);font-family:monospace;}
  .req-local{font-size:15px;font-weight:700;margin:2px 0 4px;}
  .req-desc{font-size:13px;color:var(--text-dim);margin-bottom:8px;}
  .req-meta{font-size:11.5px;color:var(--text-dim);display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.aberta{background:rgba(227,179,65,.18);color:var(--amber);}
  .badge.andamento{background:rgba(63,214,201,.15);color:var(--teal-bright);}
  .badge.concluida{background:rgba(76,175,110,.18);color:var(--ok);}
  .badge.prio-alta{background:rgba(217,106,90,.18);color:var(--bad);}
  .badge.prio-normal{background:rgba(255,255,255,.08);color:var(--text-dim);}
  .req-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .empty-state{padding:50px 20px;text-align:center;color:var(--text-dim);}
  .search-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .search-row input{flex:1;min-width:200px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;}

  /* report */
  .report-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .report-tabs button{background:var(--panel);border:1px solid var(--line);color:var(--text-dim);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .report-tabs button.active{background:var(--teal);color:#06211f;border-color:var(--teal);}
  .goal-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;
    display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:18px;
  }
  .gauge{position:relative;width:140px;height:140px;flex-shrink:0;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge-value{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge-value .pct{font-size:26px;font-weight:800;}
  .gauge-value .lbl{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;}
  .goal-info{flex:1;min-width:220px;}
  .goal-info h3{margin:0 0 6px;font-size:15px;}
  .goal-info p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.5;}
  .status-pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-top:8px;}
  .status-pill.ok{background:rgba(76,175,110,.18);color:var(--ok);}
  .status-pill.warn{background:rgba(217,106,90,.18);color:var(--bad);}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .stat-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .stat-box .num{font-size:22px;font-weight:800;color:var(--teal-bright);}
  .stat-box .lbl{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.3px;margin-top:2px;}

  .turn-breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:22px;}
  .turn-mini{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .turn-mini .tlabel{font-size:12px;color:var(--teal-bright);font-weight:700;margin-bottom:6px;}
  .mini-track{height:7px;background:var(--panel-2);border-radius:5px;overflow:hidden;margin:6px 0;}
  .mini-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-bright));}
  .mini-fill.warn{background:linear-gradient(90deg,#b5523f,var(--bad));}
  .turn-mini .tpct{font-size:13px;font-weight:700;}

  table.report-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  table.report-table th, table.report-table td{padding:9px 12px;font-size:12.5px;border-bottom:1px solid var(--line);text-align:left;}
  table.report-table th{background:var(--panel-2);color:var(--teal-bright);font-weight:700;}
  table.report-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
  table.report-table tr:last-child td{border-bottom:none;}
  .row-ok{color:var(--ok);font-weight:700;}
  .row-warn{color:var(--bad);font-weight:700;}
  .section-title{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin:24px 0 10px;}
</style>
</head>

<script>
/* ===================== PERSISTÊNCIA COMPARTILHADA (Firebase) =====================
   Todos os usuários que abrirem este arquivo se conectam ao mesmo banco de
   dados na nuvem (Firebase Realtime Database), então qualquer alteração
   feita por um usuário (marcar limpeza, abrir solicitação, etc.) aparece
   para todos os outros. O nome do funcionário logado fica salvo só no
   navegador local (cada pessoa/dispositivo mantém o seu). */
const firebaseConfig = {
  apiKey: "AIzaSyDGyxkynuZ-CUHxKa5Nao21lhlVID0yr2k",
  authDomain: "sistema-de-limpeza-betim.firebaseapp.com",
  databaseURL: "https://sistema-de-limpeza-betim-default-rtdb.firebaseio.com",
  projectId: "sistema-de-limpeza-betim",
  storageBucket: "sistema-de-limpeza-betim.firebasestorage.app",
  messagingSenderId: "416446347972",
  appId: "1:416446347972:web:37b5481d7ef3307f59a791"
};
firebase.initializeApp(firebaseConfig);
const fbRoot = firebase.database().ref('sistema_limpeza');
const fbRequestsRef = fbRoot.child('requests');

// Chaves que ficam salvas apenas no navegador local (preferência por dispositivo),
// em vez de sincronizadas entre todos os usuários.
const LOCAL_ONLY_KEYS = new Set(['currentEmployee']);

// Wrapper com timeout para evitar travamento em chamadas Firebase
function withTimeout(promise, ms=8000){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}

window.storage = {
  async get(key, shared){
    if(LOCAL_ONLY_KEYS.has(key)){
      try{
        const raw = localStorage.getItem('sistema_limpeza_local::'+key);
        return raw===null ? null : { key, value: raw, shared:false };
      }catch(e){ return null; }
    }
    try{
      const snap = await withTimeout(fbRoot.child(encodeKey(key)).get());
      if(!snap.exists()) return null;
      return { key, value: snap.val(), shared: !!shared };
    }catch(e){ console.error('Firebase get error', e); return null; }
  },
  async set(key, value, shared){
    if(LOCAL_ONLY_KEYS.has(key)){
      try{
        localStorage.setItem('sistema_limpeza_local::'+key, value);
        return { key, value, shared:false };
      }catch(e){ return null; }
    }
    try{
      await withTimeout(fbRoot.child(encodeKey(key)).set(value));
      return { key, value, shared: !!shared };
    }catch(e){ console.error('Firebase set error', e); return null; }
  },
  async delete(key, shared){
    if(LOCAL_ONLY_KEYS.has(key)){
      try{ localStorage.removeItem('sistema_limpeza_local::'+key); return { key, deleted:true, shared:false }; }
      catch(e){ return null; }
    }
    try{
      await withTimeout(fbRoot.child(encodeKey(key)).remove());
      return { key, deleted:true, shared: !!shared };
    }catch(e){ console.error('Firebase delete error', e); return null; }
  },
  async list(prefix, shared){
    try{
      const snap = await withTimeout(fbRoot.get());
      if(!snap.exists()) return { keys:[], prefix, shared: !!shared };
      const all = Object.keys(snap.val()).map(decodeKey);
      const keys = prefix ? all.filter(k=>k.startsWith(prefix)) : all;
      return { keys, prefix, shared: !!shared };
    }catch(e){ console.error('Firebase list error', e); return null; }
  }
};

// Firebase Realtime Database não aceita '.', '#', '$', '[', ']' em chaves.
// Nossas chaves usam ':' (permitido), mas por segurança escapamos '.' também.
function encodeKey(k){ return k.replace(/\./g, '__DOT__').replace(/-/g, '__HYP__'); }
function decodeKey(k){ return k.replace(/__DOT__/g, '.').replace(/__HYP__/g, '-'); }

  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));

}

function resolveFreq(loc, turnKey, date){
  // Sempre usa a data explicitamente passada (lida do seletor de data do formulário).
  // Cria uma cópia normalizada para garantir que getDay() reflita o dia correto
  // independentemente do fuso horário local — evita off-by-one quando a data
  // vem de um <input type="date"> (ex: "2025-07-22" → new Date("2025-07-22")
  // é interpretado como UTC meia-noite, mas getDay() usa hora local).
  const ref = date ? (() => {
    const d = new Date(date);
    // Se a data veio de um input type="date" ela já está como objeto Date local;
    // se por acaso for meia-noite UTC (string ISO), corrige para o dia local:
    if(d.getHours()===0 && d.getMinutes()===0 && d.getTimezoneOffset()!==0){
      d.setMinutes(d.getMinutes() + d.getTimezoneOffset()); // ajusta para local
    }
    return d;
  })() : currentDate;
  const dow = ref.getDay(); // 0=Dom, 1=Seg … 6=Sáb

  const raw = loc.f[turnKey];
  if(raw === '3pw'){
    // Seg(1), Qua(3), Sex(5)
    return (dow===1||dow===3||dow===5) ? 1 : 0;
  }
  if(typeof raw === 'string' && raw.startsWith('wk:')){
    // 'wk:2,5' = ocorre nos dias da semana informados (0=Dom..6=Sáb), 1x em cada
    const days = raw.slice(3).split(',').map(Number);
    return days.includes(dow) ? 1 : 0;
  }
  return typeof raw === 'number' ? raw : 0;
}

/* ===================== ATRASO AUTOMÁTICO =====================
   Turno 1: 06h–18h  |  Turno 2: 18h–06h (do dia seguinte).
   Em cada dia, só uma das colunas (Par ou Ímpar) do turno está "em jogo",
   dependendo se o dia do mês é par ou ímpar. As ocorrências daquele turno
   são distribuídas em intervalos iguais dentro das 12h — ex: 6 ocorrências
   = 1 a cada 2h. Se o horário-limite de uma ocorrência já passou e ela
   continua "pendente", ela é destacada em vermelho automaticamente (sem
   alterar o dado salvo — é só um alerta visual). */
function isParDay(date){ return date.getDate()%2===0; }
function turnParity(turnKey){ return (turnKey==='T1D'||turnKey==='T1N') ? 'par' : 'impar'; }
function getShiftWindow(turnKey, date){
  const d = new Date(date); d.setHours(0,0,0,0);
  if(turnKey==='T1D' || turnKey==='T2D'){
    const start = new Date(d); start.setHours(6,0,0,0);
    const end = new Date(d); end.setHours(18,0,0,0);
    return {start, end};
  } else {
    const start = new Date(d); start.setHours(18,0,0,0);
    const end = new Date(d); end.setDate(end.getDate()+1); end.setHours(6,0,0,0);
    return {start, end};
  }
}
function occDeadline(loc, turnKey, idx, date){
  const n = resolveFreq(loc, turnKey, date);
  if(!n || idx>=n) return null;
  const {start,end} = getShiftWindow(turnKey, date);
  const interval = (end-start)/n;
  return new Date(start.getTime() + interval*(idx+1));
}
function isOverdue(loc, turnKey, idx, date, state){
  if(state!=='pending') return false; // já marcado — não fica atrasado
  const dayPar = isParDay(date);
  const colParity = turnParity(turnKey);
  if((dayPar && colParity!=='par') || (!dayPar && colParity!=='impar')) return false; // coluna não roda neste dia
  const deadline = occDeadline(loc, turnKey, idx, date);
  if(!deadline) return false;
  const nowBRT2 = new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'})).getTime();
  return nowBRT2 > deadline.getTime();
}
// Retorna true se o local é banheiro (frequência 6 por turno)
function isBathroomLoc(loc){
  return Object.values(loc.f).some(v => v === 6);
}
// Retorna true se o turno está fora do horário atual
// T1D/T2D = Par, T1N/T2N = Ímpar
// Dentro do turno: T*D (diurno) = 06:00-18:00 | T*N (noturno) = 18:00-06:00
function isTurnBlocked(turnKey){
  if(isAdmin) return false;
  // Usa fuso de Brasília (UTC-3) para garantir horário correto independente do dispositivo
  const nowBRT = new Date(new Date().toLocaleString('en-US', {timeZone:'America/Sao_Paulo'}));
  const h = nowBRT.getHours();
  const isDiurnoAgora = h >= 6 && h < 18;
  // D = diurno (06-18h), N = noturno (18-06h)
  const turnIsDiurno  = turnKey === 'T1D' || turnKey === 'T2D';
  const turnIsNoturno = turnKey === 'T1N' || turnKey === 'T2N';
  if(turnIsDiurno  && !isDiurnoAgora) return true;  // turno diurno bloqueado à noite
  if(turnIsNoturno &&  isDiurnoAgora) return true;  // turno noturno bloqueado de dia
  return false;
}
// banheiros fora da janela de ±2h do deadline (muito cedo OU muito tarde)
// Admin ignora o bloqueio
function isBlockedLate(loc, turnKey, idx, date, state){
  if(state !== 'pending') return false; // já marcado — não bloqueia
  if(!isBathroomLoc(loc)) return false; // só banheiros
  if(isAdmin) return false; // admin ignora restrição
  const deadline = occDeadline(loc, turnKey, idx, date);
  if(!deadline) return false;
  const nowBRT = new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'})).getTime();
  const dl = deadline.getTime();
  const tooEarly = nowBRT < dl - 2 * 60 * 60 * 1000; // mais de 2h antes
  const tooLate  = nowBRT > dl + 2 * 60 * 60 * 1000; // mais de 2h depois
  return tooEarly || tooLate;
}

/* ===================== FOTO ANEXADA NAS SOLICITAÇÕES =====================
   Comprime a imagem no navegador (redimensiona + JPEG) antes de salvar como
   base64 junto da solicitação no Firebase — evita depender de um serviço de
   armazenamento de arquivos separado. */
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('Não foi possível ler a imagem.'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('Não foi possível ler o arquivo.'));
    reader.readAsDataURL(file);
  });
}
async function compressImageWithLimit(file, maxBytes){
  let dataUrl = await compressImage(file, 900, 0.6);
  if(dataUrl.length > maxBytes) dataUrl = await compressImage(file, 700, 0.45);
  if(dataUrl.length > maxBytes) dataUrl = await compressImage(file, 500, 0.35);
  return dataUrl;
}

    document.getElementById('datePicker').onchange = (e)=>{
      const [y,m,d] = e.target.value.split('-').map(Number);
      currentDate = new Date(y,m-1,d);
      renderChecklist();
    };
    document.getElementById('prevBtn').onclick = ()=>{
      currentDate.setDate(currentDate.getDate() - (mode==='week'?7:1));
      renderTopControls(); renderChecklist();
    };
    document.getElementById('nextBtn').onclick = ()=>{
      currentDate.setDate(currentDate.getDate() + (mode==='week'?7:1));
      renderTopControls(); renderChecklist();
    };
  } else if(section==='report'){
    tc.innerHTML = `
      <div class="seg">
        <button id="repDay" class="${reportPeriod==='day'?'active':''}">Dia</button>
        <button id="repWeek" class="${reportPeriod==='week'?'active':''}">Semana</button>
        <button id="repMonth" class="${reportPeriod==='month'?'active':''}">Mês</button>
      </div>
      <button class="nav-btn" id="repPrev">‹</button>
      <input type="date" id="repDatePicker" value="${dateStr(reportDate)}">
      <button class="nav-btn" id="repNext">›</button>
    `;
    document.getElementById('repDay').onclick = ()=>{reportPeriod='day'; renderTopControls(); renderReport();};
    document.getElementById('repWeek').onclick = ()=>{reportPeriod='week'; renderTopControls(); renderReport();};
    document.getElementById('repMonth').onclick = ()=>{reportPeriod='month'; renderTopControls(); renderReport();};
    document.getElementById('repDatePicker').onchange = (e)=>{
      const [y,m,d] = e.target.value.split('-').map(Number);
      reportDate = new Date(y,m-1,d);
      renderReport();
    };
    document.getElementById('repPrev').onclick = ()=>{
      if(reportPeriod==='day') reportDate.setDate(reportDate.getDate()-1);
      else if(reportPeriod==='week') reportDate.setDate(reportDate.getDate()-7);
      else reportDate.setMonth(reportDate.getMonth()-1);
      renderTopControls(); renderReport();
    };
    document.getElementById('repNext').onclick = ()=>{
      if(reportPeriod==='day') reportDate.setDate(reportDate.getDate()+1);
      else if(reportPeriod==='week') reportDate.setDate(reportDate.getDate()+7);
      else reportDate.setMonth(reportDate.getMonth()+1);
      renderTopControls(); renderReport();
    };
  } else {
    tc.innerHTML = '';
  }
}

function showBlockedAlert(type, availableAt){
  let el = document.getElementById('blockedAlertBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'blockedAlertBanner';
    document.body.appendChild(el);
  }
  if(type === 'turn'){
    el.innerHTML = `🕐 <strong>Fora do horário do turno.</strong><br>Este turno só pode ser registrado a partir das <strong>${availableAt}</strong>.`;
  } else if(type === 'early'){
    el.innerHTML = `⏳ <strong>Ainda não está no horário.</strong><br>Esta limpeza só pode ser registrada a partir das <strong>${availableAt}</strong>.`;
  } else {
    el.innerHTML = '⏱ <strong>Prazo encerrado.</strong><br>O prazo máximo para lançar esta limpeza é de até <strong>2 horas</strong> após o horário planejado. A ocorrência foi contabilizada como <strong>não realizada</strong>.';
  }
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.display='none'; }, 4000);
}

function hideLoader(){
  const ol = document.getElementById('loadingOverlay');
  if(ol){ ol.style.opacity='0'; setTimeout(()=>ol.remove(), 300); }
}
async function renderChecklist(){
  if(mode==='day') await renderDay(); else await renderWeek();
}

async function renderDay(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Carregando dia...</div>';
  const ds = dateStr(currentDate);
  const data = await loadDay(ds);

  let totalOcc=0, doneOcc=0;
  const turns = activeTurns(currentDate);
  LOCATIONS.forEach(loc=>{
    turns.forEach(t=>{
      const n = resolveFreq(loc, t.key, currentDate);
      for(let i=0;i<n;i++){
        totalOcc++;
        const k = loc.name+'|'+t.key+'|'+i;
        if(getEntry(data,k).state==='done') doneOcc++;
      }
    });
  });
  const pct = totalOcc? Math.round(doneOcc/totalOcc*100):0;

  // turn color scheme: Par = teal, Ímpar = amber/purple
  const TURN_COLORS = {
    T1D: { head:'#1a5c5e', accent:'#3fd6c9', label:'Par' },
    T2D: { head:'#3b2a6b', accent:'#a78bfa', label:'Ímpar' },
    T1N: { head:'#1a5c5e', accent:'#3fd6c9', label:'Par' },
    T2N: { head:'#3b2a6b', accent:'#a78bfa', label:'Ímpar' },
  };

  let html = `
    <div class="progress-bar-outer">
      <div class="label">${fmtBR(currentDate)} — progresso do dia</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-pct">${pct}%</div>
    </div>

    <!-- lupa / filtro -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
      <div class="lsearch-wrap">
        <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text-dim);pointer-events:none;z-index:1;">🔍</span>
        <input type="text" id="locSearch" placeholder="Buscar local..." autocomplete="off"
          style="width:100%;padding:9px 12px 9px 34px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;font-size:13.5px;">
        <div class="lsearch-dd" id="locSearchDD"></div>
      </div>
      <div style="display:flex;gap:8px;font-size:12px;">
        ${currentDate.getDate()%2===0
          ? '<span style="display:flex;align-items:center;gap:5px;color:#3fd6c9;font-weight:700;"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#1f8a8c;"></span>Dia par — exibindo T1 Par e T2 Par</span>'
          : '<span style="display:flex;align-items:center;gap:5px;color:#a78bfa;font-weight:700;"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#7c3aed;"></span>Dia ímpar — exibindo T1 Ímpar e T2 Ímpar</span>'
        }
      </div>
    </div>

    <div class="turn-grid" id="turnGrid">
  `;

  turns.forEach(t=>{
    const tc = TURN_COLORS[t.key];
    html += `<div class="turn-card" data-turn="${t.key}" style="border-color:${tc.accent}33;">
      <div class="turn-head" style="background:${tc.head};border-bottom-color:${tc.accent}44;">
        <span style="color:${tc.accent};">${t.label}</span>
        <span class="count" data-turncount="${t.key}" style="color:${tc.accent};opacity:.7;"></span>
      </div>`;
    LOCATIONS.forEach(loc=>{
      const n = resolveFreq(loc, t.key, currentDate);
      if(n<=0) return;
      html += `<div class="loc-row" data-locname="${loc.name.toLowerCase()}"><div class="loc-name">${loc.name}</div><div class="occ-list">`;
      for(let i=0;i<n;i++){
        const k = loc.name+'|'+t.key+'|'+i;
        const entry = getEntry(data,k);
        const st = entry.state || 'pending';
        const overdue = isOverdue(loc, t.key, i, currentDate, st);
        const blocked = isBlockedLate(loc, t.key, i, currentDate, st) || (st==='pending' && isTurnBlocked(t.key));
        const cls = blocked ? 'overdue blocked-late' : overdue ? 'overdue' : st;
        let title = 'Pendente';
        if(entry.ts){
          title = (st==='done'?'Concluído':'Não realizado')+' em '+fmtBR(new Date(entry.ts))+' '+fmtTime(entry.ts);
          if(entry.emp) title += ' — '+entry.emp;
        } else if(st==='pending' && isTurnBlocked(t.key)){
          const isDiurno = t.key==='T1D'||t.key==='T2D';
          title = isDiurno
            ? 'Turno diurno — disponível das 06:00 às 18:00'
            : 'Turno noturno — disponível das 18:00 às 06:00';
        } else if(blocked){
          const dl = occDeadline(loc, t.key, i, currentDate);
          const now = Date.now();
          const dlMs = dl ? dl.getTime() : 0;
          const tooEarly = now < dlMs - 2*3600000;
          title = tooEarly
            ? `Disponível a partir das ${fmtTime(dlMs - 2*3600000)} — aguarde o horário`
            : 'Prazo encerrado — lançamento não permitido após 2h do horário planejado';
        } else if(overdue){
          const dl = occDeadline(loc, t.key, i, currentDate);
          title = 'Atrasado — deveria ter sido feito até '+fmtTime(dl.getTime());
        }
        const dl = occDeadline(loc, t.key, i, currentDate);
        const dlTime = dl ? fmtTime(dl.getTime()) : '';
        const isBathroom = isBathroomLoc(loc);
        let timeHtml = '';
        if(entry.ts && isBathroom){
          timeHtml = `<div class="occ-time">${fmtTime(entry.ts)}${entry.emp?'<br>'+entry.emp.split(' ')[0]:''}</div>`;
        } else if(dlTime && isBathroom){
          const timeColor = blocked ? 'var(--bad)' : overdue ? 'var(--bad)' : 'var(--text-dim)';
          timeHtml = `<div class="occ-time" style="color:${timeColor};${(blocked||overdue)?'font-weight:600;':''}">${dlTime}</div>`;
        }
        html += `<div class="occ-wrap"><div class="occ ${cls}" data-key="${k}" data-blocked="${blocked}" title="${title}">${blocked?'🔒':overdue?'!':stateSymbol(st)}</div>${timeHtml}</div>`;
      }
      html += `</div></div>`;
    });
    html += `</div>`;
  });

  html += `</div>
    <div class="legend">
      <span><span class="dot pending"></span>Pendente</span>
      <span><span class="dot done"></span>Concluído</span>
      <span><span class="dot bad"></span>Não realizado</span>
      <span><span class="dot bad" style="animation:overduePulse 1.4s ease-in-out infinite;"></span>Atrasado (automático)</span>
    </div>
    <div class="legend">Clique numa célula para alternar: pendente → concluído → não realizado.</div>
  `;
  app.innerHTML = html;

  // contadores por turno
  turns.forEach(t=>{
    let total=0, done=0;
    LOCATIONS.forEach(loc=>{
      const n = resolveFreq(loc, t.key, currentDate);
      total += n;
      for(let i=0;i<n;i++){
        const k = loc.name+'|'+t.key+'|'+i;
        if(getEntry(data,k).state==='done') done++;
      }
    });
    const elSpan = app.querySelector(`[data-turncount="${t.key}"]`);
    if(elSpan) elSpan.textContent = done+'/'+total;
  });

  // lupa: filtra + autocomplete dropdown
  (function(){
    const input = document.getElementById('locSearch');
    const dd = document.getElementById('locSearchDD');
    if(!input || !dd) return;

    function getLocNames(){
      const names = new Set();
      app.querySelectorAll('.loc-row[data-locname]').forEach(r=>names.add(r.getAttribute('data-locname')));
      return [...names];
    }

    function filterRows(q){
      app.querySelectorAll('.loc-row[data-locname]').forEach(row=>{
        const match = !q || row.getAttribute('data-locname').includes(q);
        row.style.display = match ? '' : 'none';
      });
    }

    function openDD(q){
      const all = getLocNames();
      const filtered = q ? all.filter(n=>n.includes(q)) : all;
      dd.innerHTML = '';
      if(!filtered.length){
        dd.innerHTML = '<div class="lsearch-empty">Nenhum ambiente encontrado</div>';
      } else {
        // Show max 12 suggestions
        filtered.forEach(name=>{
          const div = document.createElement('div');
          div.className = 'lsearch-item';
          // Get display name from loc-row
          const row = app.querySelector(`.loc-row[data-locname="${name}"]`);
          const displayName = row ? (row.querySelector('.loc-name')?.textContent || name) : name;
          div.textContent = displayName;
          div.addEventListener('mousedown', e=>{
            e.preventDefault();
            input.value = displayName;
            filterRows(name);
            dd.classList.remove('open');
            // Scroll to first match
            const target = app.querySelector('.loc-row[data-locname="'+name+'"]');
            if(target) target.scrollIntoView({behavior:'smooth', block:'center'});
          });
          dd.appendChild(div);
        });
      }
      dd.classList.add('open');
    }

    input.addEventListener('focus', ()=>{ openDD(input.value.toLowerCase().trim()); });
    input.addEventListener('input', ()=>{
      const q = input.value.toLowerCase().trim();
      filterRows(q);
      openDD(q);
    });
    input.addEventListener('blur', ()=>{ setTimeout(()=>dd.classList.remove('open'), 200); });
    input.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ input.value=''; filterRows(''); dd.classList.remove('open'); }
    });
    document.addEventListener('click', e=>{ if(!input.contains(e.target)&&!dd.contains(e.target)) dd.classList.remove('open'); });
  })();

  // clique nas ocorrências
  app.querySelectorAll('.occ').forEach(el=>{
    el.addEventListener('click', async ()=>{
      // Bloqueia lançamento retroativo para banheiros após 2h do prazo (admin pode ignorar)
      if(el.getAttribute('data-blocked')==='true' && !isAdmin){
        const key = el.getAttribute('data-key');
        const parts = key.split('|');
        const locName = parts[0];
        const turnKey = parts[1];
        const idx = parseInt(parts[2]);

        // Bloqueio de turno
        if(isTurnBlocked(turnKey)){
          const isDiurno = turnKey==='T1D'||turnKey==='T2D';
          showBlockedAlert('turn', isDiurno ? '06:00' : '18:00');
          return;
        }

        const loc = LOCATIONS.find(l=>l.name===locName);
        const dl = loc ? occDeadline(loc, turnKey, idx, currentDate) : null;
        const tooEarly = dl && Date.now() < dl.getTime() - 2*3600000;
        showBlockedAlert(tooEarly ? 'early' : 'late', dl ? fmtTime(dl.getTime() - 2*3600000) : '');
        return;
      }
      const k = el.getAttribute('data-key');
      const cur = getEntry(data,k).state;
      const next = cycleState(cur);
      if(next==='pending'){
        delete data[k];
      } else {
        const name = prompt('Quem realizou esta limpeza?', currentEmployee || '');
        if(!name || !name.trim()){ return; }
        const empName = name.trim();
        await saveEmployee(empName);
        data[k] = {state:next, ts:Date.now(), emp:empName};
      }
      await saveDay(ds);
      renderDay();
    });
  });
}

async function renderWeek(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Carregando semana...</div>';
  const monday = startOfWeek(currentDate);
  const days = [];
  for(let i=0;i<7;i++){ const d=new Date(monday); d.setDate(d.getDate()+i); days.push(d); }
  const dayNames = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  const dataByDay = {};
  for(const d of days){ const ds=dateStr(d); dataByDay[ds] = await loadDay(ds); }

  let html = `<div class="week-title">Semana de ${fmtBR(days[0])} a ${fmtBR(days[6])}</div>
    <div class="tablewrap"><table class="week"><thead><tr><th style="text-align:left">Local</th>`;
  days.forEach(d=>{ html += `<th>${dayNames[d.getDay()]}<br>${pad(d.getDate())}/${pad(d.getMonth()+1)}</th>`; });
  html += `</tr></thead><tbody>`;

  LOCATIONS.forEach(loc=>{
    html += `<tr><td class="locname">${loc.name}</td>`;
    days.forEach(d=>{
      const ds = dateStr(d);
      const data = dataByDay[ds];
      let total=0, done=0, hasBad=false;
      TURNS.forEach(t=>{
        const n = resolveFreq(loc, t.key, d);
        total += n;
        for(let i=0;i<n;i++){
          const k = loc.name+'|'+t.key+'|'+i;
          const st = getEntry(data,k).state;
          if(st==='done') done++;
          if(st==='bad') hasBad = true;
        }
      });
      let cls='empty', label='—';
      if(done===total && total>0){cls='full'; label='✓';}
      else if(hasBad){cls='hasbad'; label=done+'/'+total;}
      else if(done>0){cls='partial'; label=done+'/'+total;}
      html += `<td class="daycell" data-date="${ds}"><span class="chip ${cls}">${label}</span></td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div>
    <div class="legend">
      <span><span class="chip full" style="padding:2px 6px;">✓</span> Tudo concluído</span>
      <span><span class="chip partial" style="padding:2px 6px;">n/m</span> Parcial</span>
      <span><span class="chip hasbad" style="padding:2px 6px;">n/m</span> Com não realizado</span>
      <span><span class="chip empty" style="padding:2px 6px;">—</span> Nada registrado</span>
    </div>
    <div class="legend">Clique em qualquer dia da semana para abrir o checklist detalhado.</div>
  `;
  app.innerHTML = html;
  app.querySelectorAll('.daycell').forEach(td=>{
    td.addEventListener('click', ()=>{
      const ds = td.getAttribute('data-date');
      const [y,m,dd] = ds.split('-').map(Number);
      currentDate = new Date(y,m-1,dd);
      mode='day';
      renderTopControls();
      renderChecklist();
    });
  });
}

/* ---- REQUEST STORAGE: memória primária + storage como backup ---- */
let _requests = []; // array em memória — sempre funciona
let _reqLoaded = false;

let _migrated = false;
async function migrateOldRequestsIfNeeded(){
  if(_migrated) return;
  _migrated = true;
  try{
    const oldSnap = await withTimeout(fbRoot.child('allreqs').get(), 5000);
    if(oldSnap.exists()){
      const newSnap = await withTimeout(fbRequestsRef.get(), 5000);
      if(!newSnap.exists()){
        const arr = JSON.parse(oldSnap.val());
        if(Array.isArray(arr) && arr.length){
          const updates = {};
          arr.forEach(r=>{ if(r && r.id) updates[r.id]=r; });
          await fbRequestsRef.update(updates);
        }
      }
    }
  }catch(e){ console.error('Falha na migração de solicitações antigas', e); }
}

async function ensureRequestsLoaded(){
  // Sempre busca do Firebase (sem cache permanente) para refletir
  // solicitações criadas/alteradas por outros usuários.
  await migrateOldRequestsIfNeeded();
  try{
    const snap = await withTimeout(fbRequestsRef.get());
    _requests = snap.exists() ? Object.values(snap.val()) : [];
  }catch(e){ /* mantém dados atuais em memória se a busca falhar */ }
  _reqLoaded = true;
}
async function loadAllRequests(){
  await ensureRequestsLoaded();
  return [..._requests].sort((a,b)=>b.createdAt-a.createdAt);
}
async function saveRequest(id, obj){
  try{
    await fbRequestsRef.child(id).set(obj);
    const idx = _requests.findIndex(r=>r.id===id);
    if(idx>=0) _requests[idx]=obj; else _requests.push(obj);
    return true;
  }catch(e){ console.error('Erro ao salvar solicitação', e); return false; }
}
async function loadRequest(id){
  await ensureRequestsLoaded();
  return _requests.find(r=>r.id===id) || null;
}
async function deleteRequest(id){
  await fbRequestsRef.child(id).remove();
  _requests = _requests.filter(r=>r.id!==id);
}

function statusBadge(status){
  if(status==='concluida') return '<span class="badge concluida">Concluída ✓</span>';
  if(status==='excluida')  return '<span class="badge excluida">Excluída</span>';
  if(status==='andamento') return '<span class="badge andamento">Em andamento</span>';
  return '<span class="badge aberta">Pendente</span>';
}
function prioBadge(p){
  return p==='alta' ? '<span class="badge prio-alta">Urgente</span>' : '<span class="badge prio-normal">Normal</span>';
}

function reqCardHtml(r, showActions){

    ? `<span>Responsável: <strong>${r.assignee}</strong>${r.assignedAt ? ' às '+fmtBRTime(new Date(r.assignedAt)) : ''}</span>`
    : '';
  const closedLine = r.status==='concluida' && r.closedAt
    ? `<span>Concluída em: <strong>${fmtBRTime(new Date(r.closedAt))}</strong>${r.closedBy?' por '+r.closedBy:''}</span>` : '';

  const actions = showActions ? `
    <div class="req-actions">
      ${r.status!=='concluida' ? `<button class="btn small" data-action="concluida">Marcar como concluída</button>` : ''}
      ${(r.status==='concluida' && isAdmin) ? `<button class="btn small secondary" data-action="aberta">Reabrir</button>` : ''}
      ${r.status==='andamento' ? `<button class="btn small secondary" data-action="aberta">Voltar para pendente</button>` : ''}
      ${r.status!=='concluida' ? `<button class="btn small secondary" data-assign>${r.assignee ? 'Alterar responsável' : 'Atribuir responsável'}</button>` : ''}

    </div>` : isAdmin ? `
    <div class="req-actions">
      <button class="btn small secondary" data-action="delete" style="color:var(--bad);border-color:var(--bad);">Excluir</button>
    </div>` : '';

  const fotoHtml = r.foto ? `<img src="${r.foto}" class="req-photo-thumb" alt="Foto da solicitação" title="Foto da solicitação (clique para ampliar)">` : '';
  const tipoHtml = r.tipo ? `<span class="badge" style="background:rgba(63,214,201,.12);color:var(--teal-bright);margin-right:4px;">📋 ${r.tipo}</span>` : '';
  const evidenciaHtml = r.evidencia ? `
    <div style="margin-top:10px;">
      <div style="font-size:11px;color:var(--ok);font-weight:700;margin-bottom:4px;">📷 Evidência de conclusão</div>
      <img src="${r.evidencia}" class="req-photo-thumb" alt="Evidência de conclusão" title="Evidência de conclusão (clique para ampliar)" style="border-color:var(--ok);">
    </div>` : '';

  return `<div class="req-card" data-id="${r.id}">
    <div class="req-top">
      <div>
        <div class="req-id">#${r.id}</div>
        <div class="req-local">${r.local}</div>
        ${tipoHtml}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">${statusBadge(r.status)}${prioBadge(r.prio)}</div>
    </div>
    <div class="req-desc">${r.desc}</div>
    ${fotoHtml}
    ${evidenciaHtml}
    <div class="req-meta">
      <span>Solicitante: ${r.nome}</span>
      <span>Aberta em: ${fmtBRTime(new Date(r.createdAt))}</span>
      ${assignLine}
      ${closedLine}
    </div>
    ${actions}
  </div>`;
}

function wireReqCard(card, onUpdate){
  const id = card.getAttribute('data-id');
  card.querySelectorAll('.req-photo-thumb').forEach(img=>{
    img.addEventListener('click', ()=> showPhotoLightbox(img.src));
  });
  card.querySelectorAll('[data-action]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const r = await loadRequest(id);
      const action = btn.getAttribute('data-action');
      if(action==='delete'){
        if(!isAdmin){ alert('Ação restrita ao administrador.'); return; }
        if(!confirm('Excluir esta solicitação permanentemente?')) return;
        // Marca como excluída em vez de deletar do Firebase (preserva histórico)
        r.status = 'excluida';
        r.deletedAt = Date.now();
        r.updatedAt = Date.now();
        await saveRequest(id, r);
        onUpdate();
        return;
      }
      if(action==='concluida'){
        openCloseModal(r, async (who, evidenciaDataUrl)=>{
          r.status='concluida';
          r.closedAt=Date.now();
          r.closedBy=who.trim();
          r.updatedAt=Date.now();
          if(evidenciaDataUrl) r.evidencia=evidenciaDataUrl;
          await saveRequest(id, r);
          onUpdate();
        });
      } else {
        r.status=action;
        r.updatedAt=Date.now();
        await saveRequest(id, r);
        onUpdate();
      }
    });
  });
  card.querySelectorAll('[data-assign]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const r = await loadRequest(id);
      const name = prompt('Nome do responsável pelo atendimento:', r.assignee||'');
      if(name===null) return;
      r.assignee = name.trim();
      r.assignedAt = Date.now();
      r.updatedAt = Date.now();
      // Ao atribuir responsável, promove automaticamente para "em andamento"
      if(r.status==='aberta') r.status='andamento';
      await saveRequest(id, r);
      onUpdate();
    });
  });
}

    }

      const filtered = getFiltered(q);

      if(!filtered.length){

        filtered.forEach(item=>{

      const avgMs = valid.reduce((s,r)=>s+(r.closedAt-r.createdAt),0)/valid.length;

      return h<1 ? Math.round(h*60)+'min' : h<24 ? h.toFixed(1)+'h' : (h/24).toFixed(1)+'d';
    }
    function slaMediaMs(list){
      const valid = list.filter(r=>r.status==='concluida'&&r.closedAt&&r.createdAt);

      resEl.innerHTML=`<div class="section-title">Resultado da busca (${matches.length})</div>`+matches.map(r=>reqCardHtml(r,true)).join('');
      resEl.querySelectorAll('.req-card').forEach(card=>wireReqCard(card, renderRequests));
    };
    document.getElementById('trackBtn').addEventListener('click', doSearch);
    document.getElementById('trackInput').addEventListener('keydown',(e)=>{if(e.key==='Enter')doSearch();});
  }
}

/* ===================== RENDER REPORT ===================== */
let reportSection = 'checklist'; // 'checklist' | 'requests'

function monthLabel(d){
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return meses[d.getMonth()]+' de '+d.getFullYear();
}
function getDatesForPeriod(){
  if(reportPeriod==='day') return [new Date(reportDate)];
  if(reportPeriod==='week'){
    const monday=startOfWeek(reportDate), arr=[];
    for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(d.getDate()+i);arr.push(d);}
    return arr;
  }
  const y=reportDate.getFullYear(),m=reportDate.getMonth();
  const days=new Date(y,m+1,0).getDate(),arr=[];
  for(let i=1;i<=days;i++) arr.push(new Date(y,m,i));
  return arr;
}
function gaugeSvg(pct){
  const r=56,c=2*Math.PI*r,offset=c-(Math.min(pct,100)/100)*c;
  const color=pct>=GOAL_PCT?'#4caf6e':(pct>=80?'#e3b341':'#d96a5a');
  return `<svg width="140" height="140" viewBox="0 0 140 140">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="#1c3436" stroke-width="14"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="14"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

async function renderReport(){
  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="req-tabs" style="margin-bottom:18px;">
      <button id="repSecCL" class="${reportSection==='checklist'?'active':''}">Checklist de Limpeza</button>
      <button id="repSecRQ" class="${reportSection==='requests'?'active':''}">Solicitações</button>
    </div>
    <div id="repContent"><div class="loading">Calculando...</div></div>`;

  document.getElementById('repSecCL').onclick=()=>{reportSection='checklist';renderReport();};
  document.getElementById('repSecRQ').onclick=()=>{reportSection='requests';renderReport();};

  if(reportSection==='checklist') await renderReportChecklist();
  else await renderReportRequests();
}

async function renderReportChecklist(){
  const content=document.getElementById('repContent');
  content.innerHTML='<div class="loading">Calculando aderência...</div>';
  const dates=getDatesForPeriod();
  const dataByDate={};
  for(const d of dates){const ds=dateStr(d);dataByDate[ds]=await loadDay(ds);}

  // Acumuladores globais e por turno
  let totalAll=0,doneAll=0;
  const turnAcc={};TURNS.forEach(t=>turnAcc[t.key]={total:0,done:0});

  // T1 (diurno 7h-19h): T1D=Par, T2D=Ímpar | T2 (noturno 19h-7h): T1N=Par, T2N=Ímpar
  const shift1Keys=['T1D','T1N']; // Par: T1 Par + T2 Par (dias pares)
  const shift2Keys=['T2D','T2N']; // Ímpar: T1 Ímpar + T2 Ímpar (dias ímpares)
  const s1Acc={total:0,done:0}, s2Acc={total:0,done:0};
  const parAcc={total:0,done:0}, imparAcc={total:0,done:0};
  // Acumuladores individuais por coluna
  const colAcc={T1D:{total:0,done:0},T2D:{total:0,done:0},T1N:{total:0,done:0},T2N:{total:0,done:0}};

  // Detalhamento por dia: para cada dia, quebra em T1 e T2
  const dailyRows=[];

  dates.forEach(d=>{
    const ds=dateStr(d),data=dataByDate[ds];
    let dTotal=0,dDone=0;
    const dT1={total:0,done:0}, dT2={total:0,done:0};

    LOCATIONS.forEach(loc=>{
      TURNS.forEach(t=>{
        const n=resolveFreq(loc,t.key,d);
        for(let i=0;i<n;i++){
          const k=loc.name+'|'+t.key+'|'+i,st=getEntry(data,k).state;
          const isDone=st==='done';
          dTotal++;turnAcc[t.key].total++;
          if(isDone){dDone++;turnAcc[t.key].done++;}
          if(shift1Keys.includes(t.key)){dT1.total++;s1Acc.total++;if(isDone){dT1.done++;s1Acc.done++;}}
          else{dT2.total++;s2Acc.total++;if(isDone){dT2.done++;s2Acc.done++;}}
          colAcc[t.key].total++;if(isDone)colAcc[t.key].done++;
          if(['T1D','T1N'].includes(t.key)){parAcc.total++;if(isDone)parAcc.done++;}
          else{imparAcc.total++;if(isDone)imparAcc.done++;}
        }
      });
    });
    totalAll+=dTotal;doneAll+=dDone;
    dailyRows.push({
      d,
      total:dTotal,done:dDone,pct:dTotal?Math.round(dDone/dTotal*100):null,
      t1:dT1,t2:dT2
    });
  });

  const overallPct=totalAll?Math.round(doneAll/totalAll*100):0;
  const meetsGoal=overallPct>=GOAL_PCT,gap=GOAL_PCT-overallPct;
  const s1Pct=s1Acc.total?Math.round(s1Acc.done/s1Acc.total*100):0;
  const s2Pct=s2Acc.total?Math.round(s2Acc.done/s2Acc.total*100):0;
  const parPct=parAcc.total?Math.round(parAcc.done/parAcc.total*100):0;
  const imparPct=imparAcc.total?Math.round(imparAcc.done/imparAcc.total*100):0;

  let periodLabel='';
  if(reportPeriod==='day') periodLabel=fmtBR(reportDate);
  else if(reportPeriod==='week'){
    const monday=startOfWeek(reportDate),sunday=new Date(monday);sunday.setDate(sunday.getDate()+6);
    periodLabel='Semana de '+fmtBR(monday)+' a '+fmtBR(sunday);
  } else periodLabel=monthLabel(reportDate);

  function pctColor(p){return p===null?'var(--text-dim)':p>=GOAL_PCT?'var(--ok)':'var(--bad)';}
  function pctLabel(p){return p===null?'—':p+'%';}

  let html=`
    <div class="goal-card">
      <div class="gauge">${gaugeSvg(overallPct)}<div class="gauge-value"><div class="pct">${overallPct}%</div><div class="lbl">Aderência</div></div></div>
      <div class="goal-info">
        <h3>${periodLabel}</h3>
        <p>Meta: <strong>${GOAL_PCT}%</strong>. Concluídas <strong>${doneAll}</strong> de <strong>${totalAll}</strong> limpezas previstas.</p>
        <span class="status-pill ${meetsGoal?'ok':'warn'}">${meetsGoal?'Meta atingida ✓':`Abaixo da meta (faltam ${gap}p.p.)`}</span>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-box"><div class="num">${totalAll}</div><div class="lbl">Previstas</div></div>
      <div class="stat-box"><div class="num">${doneAll}</div><div class="lbl">Concluídas</div></div>
      <div class="stat-box"><div class="num">${totalAll-doneAll}</div><div class="lbl">Não realizadas</div></div>
      <div class="stat-box"><div class="num">${dates.length}</div><div class="lbl">${reportPeriod==='day'?'Dia':'Dias no período'}</div></div>
    </div>

    <div class="section-title">Aderência por turno (período)</div>
    <div class="turn-breakdown">
      <div class="turn-mini">
        <div class="tlabel" style="color:#3fd6c9;">Par — T1 Par + T2 Par (dias pares)</div>
        <div class="mini-track"><div class="mini-fill ${s1Pct<GOAL_PCT?'warn':''}" style="width:${s1Pct}%"></div></div>
        <div class="tpct" style="color:${s1Pct>=GOAL_PCT?'var(--ok)':'var(--bad)'};">${s1Pct}% <span style="color:var(--text-dim);font-weight:400;">(${s1Acc.done}/${s1Acc.total})</span></div>
      </div>
      <div class="turn-mini">
        <div class="tlabel" style="color:#a78bfa;">Ímpar — T1 Ímpar + T2 Ímpar (dias ímpares)</div>
        <div class="mini-track"><div class="mini-fill ${s2Pct<GOAL_PCT?'warn':''}" style="width:${s2Pct}%"></div></div>
        <div class="tpct" style="color:${s2Pct>=GOAL_PCT?'var(--ok)':'var(--bad)'};">${s2Pct}% <span style="color:var(--text-dim);font-weight:400;">(${s2Acc.done}/${s2Acc.total})</span></div>
      </div>
    </div>`;

  // Detalhamento por turno individual (Par/Ímpar)
  // Colunas na ordem: T1 Par, T2 Par / T1 Ímpar, T2 Ímpar
  const colOrder=[
    {key:'T1D', label:'T1 Par',   color:'#3fd6c9'},
    {key:'T1N', label:'T2 Par',   color:'#3fd6c9'},
    {key:'T2D', label:'T1 Ímpar', color:'#a78bfa'},
    {key:'T2N', label:'T2 Ímpar', color:'#a78bfa'},
  ];
  html+=`<div class="section-title">Aderência por coluna</div>
    <div class="turn-breakdown">`;
  colOrder.forEach(col=>{
    const a=colAcc[col.key],p=a.total?Math.round(a.done/a.total*100):0;
    html+=`<div class="turn-mini">
      <div class="tlabel" style="color:${col.color};">${col.label}</div>
      <div class="mini-track"><div class="mini-fill ${p<GOAL_PCT?'warn':''}" style="width:${p}%"></div></div>
      <div class="tpct" style="color:${p>=GOAL_PCT?'var(--ok)':'var(--bad)'};">${p}% <span style="color:var(--text-dim);font-weight:400;">(${a.done}/${a.total})</span></div>
    </div>`;
  });
  html+=`</div>`;

  // Tabela por dia com T1 e T2
  if(reportPeriod!=='day'){
    const dayNames=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    html+=`<div class="section-title">Detalhamento diário — T1 e T2</div>
      <div class="tablewrap"><table class="report-table"><thead><tr>
        <th>Data</th>
        <th class="num" style="color:#3fd6c9;">Par Concl.</th>
        <th class="num" style="color:#3fd6c9;">Par Prev.</th>
        <th class="num" style="color:#3fd6c9;">Par Ader.</th>
        <th class="num" style="color:#a78bfa;">Ímpar Concl.</th>
        <th class="num" style="color:#a78bfa;">Ímpar Prev.</th>
        <th class="num" style="color:#a78bfa;">Ímpar Ader.</th>
        <th class="num">Total</th>
        <th class="num">Ader. Dia</th>
      </tr></thead><tbody>`;
    dailyRows.forEach(r=>{
      const p1=r.t1.total?Math.round(r.t1.done/r.t1.total*100):null;
      const p2=r.t2.total?Math.round(r.t2.done/r.t2.total*100):null;
      const dow=dayNames[r.d.getDay()];
      html+=`<tr>
        <td style="white-space:nowrap;">${dow} ${fmtBR(r.d)}</td>
        <td class="num">${r.t1.done}</td>
        <td class="num">${r.t1.total}</td>
        <td class="num" style="color:${pctColor(p1)};font-weight:700;">${pctLabel(p1)}</td>
        <td class="num">${r.t2.done}</td>
        <td class="num">${r.t2.total}</td>
        <td class="num" style="color:${pctColor(p2)};font-weight:700;">${pctLabel(p2)}</td>
        <td class="num">${r.done}/${r.total}</td>
        <td class="num" style="color:${pctColor(r.pct)};font-weight:700;">${pctLabel(r.pct)}</td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;
  } else {
    // Visão do dia: mostra T1 e T2 lado a lado
    const r=dailyRows[0];
    if(r){
      const p1=r.t1.total?Math.round(r.t1.done/r.t1.total*100):null;
      const p2=r.t2.total?Math.round(r.t2.done/r.t2.total*100):null;
      html+=`<div class="section-title">Detalhamento do dia</div>
        <div class="turn-breakdown">
          <div class="turn-mini" style="flex:1;">
            <div class="tlabel" style="color:#3fd6c9;">Par (T1 Par + T2 Par)</div>
            <div class="mini-track"><div class="mini-fill ${p1!==null&&p1<GOAL_PCT?'warn':''}" style="width:${p1||0}%"></div></div>
            <div class="tpct" style="color:${pctColor(p1)};">${pctLabel(p1)} <span style="color:var(--text-dim);font-weight:400;">(${r.t1.done} concl. de ${r.t1.total} prev.)</span></div>
          </div>
          <div class="turn-mini" style="flex:1;">
            <div class="tlabel" style="color:#a78bfa;">Ímpar (T1 Ímpar + T2 Ímpar)</div>
            <div class="mini-track"><div class="mini-fill ${p2!==null&&p2<GOAL_PCT?'warn':''}" style="width:${p2||0}%"></div></div>
            <div class="tpct" style="color:${pctColor(p2)};">${pctLabel(p2)} <span style="color:var(--text-dim);font-weight:400;">(${r.t2.done} concl. de ${r.t2.total} prev.)</span></div>
          </div>
        </div>`;
    }
  }

  content.innerHTML=html;
}

async function renderReportRequests(){
  const content=document.getElementById('repContent');
  content.innerHTML='<div class="loading">Carregando solicitações...</div>';
  const allRaw=await loadAllRequests();
  const all=allRaw.filter(r=>r.status!=='excluida'); // exclui dos indicadores

  // Globais (todos os períodos)
  const abertas=all.filter(r=>r.status==='aberta');
  const andamento=all.filter(r=>r.status==='andamento');
  const concluidas=all.filter(r=>r.status==='concluida');
  const naoResolvidas=all.filter(r=>r.status!=='concluida'); // pendentes + andamento
  const taxaResGeral=all.length?Math.round(concluidas.length/all.length*100):0;

  // Período selecionado
  const dates=getDatesForPeriod();
  const startTs=new Date(dates[0]).setHours(0,0,0,0);
  const endTs=new Date(dates[dates.length-1]).setHours(23,59,59,999);
  const inPeriod=r=>r.createdAt>=startTs && r.createdAt<=endTs;
  const allPeriod=all.filter(inPeriod);
  const conPer=allPeriod.filter(r=>r.status==='concluida');
  const naoResPer=allPeriod.filter(r=>r.status!=='concluida');
  const taxaRes=allPeriod.length?Math.round(conPer.length/allPeriod.length*100):0;

  // SLA médio (abertura → conclusão) em horas
  function calcSla(list){
    const valid=list.filter(r=>r.closedAt&&r.createdAt);
    if(!valid.length) return null;
    const avg=valid.reduce((s,r)=>s+(r.closedAt-r.createdAt),0)/valid.length;
    const h=avg/3600000;
    return h<1?Math.round(h*60)+'min':h<24?h.toFixed(1)+'h':(h/24).toFixed(1)+'d';
  }
  const slaGeral=calcSla(concluidas);
  const slaPer=calcSla(conPer);

  // Breakdown por tipo de ocorrência
  const tiposGeral={};
  all.forEach(r=>{ const t=r.tipo||'Não informado'; tiposGeral[t]=(tiposGeral[t]||0)+1; });
  const tiposPer={};
  allPeriod.forEach(r=>{ const t=r.tipo||'Não informado'; tiposPer[t]=(tiposPer[t]||0)+1; });

  // Meses disponíveis para filtro
  const monthSet=new Set(allRaw.filter(r=>r.status!=='excluida').map(r=>{ const d=new Date(r.createdAt); return d.getFullYear()+'-'+(d.getMonth()+1); }));
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const monthOptions=[...monthSet].sort().reverse().map(m=>{ const [y,mo]=m.split('-'); return `<option value="${m}">${meses[parseInt(mo)-1]} ${y}</option>`; }).join('');

  // Tipos para filtro — garante que o value bate exatamente com r.tipo
  const tiposUnicos = [...new Set(all.map(r=>r.tipo||'Não informado'))].sort();
  const tipoOptions = `<option value="">Todos os tipos</option>` + tiposUnicos.map(t=>`<option value="${t}">${t}</option>`).join('');

  let periodLabel='';
  if(reportPeriod==='day') periodLabel=fmtBR(reportDate);
  else if(reportPeriod==='week'){
    const monday=startOfWeek(reportDate),sunday=new Date(monday);sunday.setDate(sunday.getDate()+6);
    periodLabel='Semana '+fmtBR(monday)+' a '+fmtBR(sunday);
  } else periodLabel=monthLabel(reportDate);

  function reqRow(r){
    const bg=r.status==='aberta'?'background:rgba(227,179,65,.06);':r.status==='andamento'?'background:rgba(63,214,201,.06);':'';
    return `<tr style="${bg}">
      <td style="white-space:nowrap;"><span class="req-id">#${r.id}</span></td>
      <td>${r.local}</td>
      <td>${r.tipo||'—'}</td>
      <td>${r.nome}</td>
      <td>${r.prio==='alta'?'<span class="badge prio-alta">Urgente</span>':'<span class="badge prio-normal">Normal</span>'}</td>
      <td>${r.assignee||r.closedBy||'<span style="color:var(--text-dim)">—</span>'}</td>
      <td>${statusBadge(r.status)}</td>
      <td style="white-space:nowrap;">${fmtBRTime(new Date(r.createdAt))}</td>
      <td style="white-space:nowrap;">${r.closedAt?fmtBRTime(new Date(r.closedAt)):'<span style="color:var(--text-dim)">—</span>'}</td>
    </tr>`;
  }
  const tableHead=`<div class="tablewrap"><table class="report-table"><thead><tr>
    <th>Código</th><th>Local</th><th>Tipo</th><th>Solicitante</th><th>Prioridade</th><th>Responsável</th><th>Status</th><th>Registrada em</th><th>Concluída em</th>
  </tr></thead><tbody>`;

  let html=`
    <!-- ===== FILTROS ===== -->
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;">
      <div style="font-size:13px;font-weight:600;color:var(--text-dim);">Filtros:</div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <label style="font-size:11px;color:var(--text-dim);">Mês</label>
        <select id="reqFilterMonth" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:7px;font-size:13px;font-family:inherit;">
          <option value="">Todos os períodos</option>
          ${monthOptions}
        </select>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <label style="font-size:11px;color:var(--text-dim);">Tipo de ocorrência</label>
        <select id="reqFilterTipo" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:7px;font-size:13px;font-family:inherit;">
          ${tipoOptions}
        </select>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <label style="font-size:11px;color:var(--text-dim);">Prioridade</label>
        <select id="reqFilterPrio" style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:7px;font-size:13px;font-family:inherit;">
          <option value="">Todas</option>
          <option value="alta">Urgente</option>
          <option value="normal">Normal</option>
        </select>
      </div>
      <button id="reqFilterApply" class="btn" style="margin-top:18px;">Aplicar</button>
      <button id="reqFilterClear" class="btn secondary" style="margin-top:18px;">Limpar</button>
    </div>

    <!-- ===== CONSOLIDADO GERAL ===== -->
    <div class="goal-card" style="flex-direction:column;gap:6px;align-items:flex-start;">
      <div style="font-size:16px;font-weight:700;">Consolidado geral de chamados</div>
      <p style="margin:0;font-size:13px;color:var(--text-dim);">Situação atual — excluídos não contabilizados.</p>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="num" style="color:var(--amber)">${abertas.length}</div><div class="lbl">Pendentes</div></div>
      <div class="stat-box"><div class="num" style="color:var(--teal-bright)">${andamento.length}</div><div class="lbl">Em andamento</div></div>
      <div class="stat-box"><div class="num" style="color:var(--bad)">${naoResolvidas.length}</div><div class="lbl">Não resolvidas</div></div>
      <div class="stat-box"><div class="num" style="color:var(--ok)">${concluidas.length}</div><div class="lbl">Concluídas</div></div>
      <div class="stat-box"><div class="num" style="color:${taxaResGeral>=80?'var(--ok)':'var(--bad)'};">${taxaResGeral}%</div><div class="lbl">Taxa de resolução</div></div>
      <div class="stat-box"><div class="num" style="color:${slaGeral?'var(--teal-bright)':'var(--text-dim)'}">${slaGeral||'—'}</div><div class="lbl">SLA médio ⓘ</div></div>
      <div class="stat-box"><div class="num">${all.length}</div><div class="lbl">Total geral</div></div>
    </div>

    <!-- ===== BREAKDOWN POR TIPO ===== -->
    <div class="section-title">Chamados por tipo de ocorrência</div>
    <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));">
      ${Object.entries(tiposGeral).sort((a,b)=>b[1]-a[1]).map(([tipo,qtd])=>{
        const pct=all.length?Math.round(qtd/all.length*100):0;
        return `<div class="stat-box">
          <div class="num" style="font-size:20px;color:var(--teal-bright);">${qtd}</div>
          <div class="lbl" style="font-size:10px;text-transform:none;letter-spacing:0;">${tipo}</div>
          <div style="margin-top:6px;height:4px;background:var(--panel-2);border-radius:3px;overflow:hidden;">
            <div style="height:100%;width:${pct}%;background:var(--teal);border-radius:3px;"></div>
          </div>
          <div style="font-size:10px;color:var(--text-dim);margin-top:3px;">${pct}% do total</div>
        </div>`;
      }).join('')}
    </div>

    <!-- ===== PENDENTES ===== -->
    <div class="section-title" style="margin-top:8px;">
      Chamados pendentes — aguardando atendimento (${naoResolvidas.length})
    </div>`;


  if(!naoResolvidas.length){
    html+=`<div class="empty-state">Nenhum chamado pendente 🎉</div>`;
  } else {
    // Separar por prioridade: urgentes primeiro
    const pendUrgente=naoResolvidas.filter(r=>r.prio==='alta').sort((a,b)=>a.createdAt-b.createdAt);
    const pendNormal=naoResolvidas.filter(r=>r.prio!=='alta').sort((a,b)=>a.createdAt-b.createdAt);
    if(pendUrgente.length){
      html+=`<div style="font-size:11px;color:var(--bad);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:10px 0 6px;">⚠ Urgentes (${pendUrgente.length})</div>`;
      html+=tableHead+pendUrgente.map(reqRow).join('')+`</tbody></table></div>`;
    }
    if(pendNormal.length){
      html+=`<div style="font-size:11px;color:var(--text-dim);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px;">Prioridade normal (${pendNormal.length})</div>`;
      html+=tableHead+pendNormal.map(reqRow).join('')+`</tbody></table></div>`;
    }
  }

    html+=`
    <!-- ===== PERÍODO SELECIONADO ===== -->
    <div class="goal-card" style="flex-direction:column;gap:10px;align-items:flex-start;margin-top:28px;">
      <div style="font-size:16px;font-weight:700;">Chamados do período — ${periodLabel}</div>
      <p style="margin:0;font-size:13px;color:var(--text-dim);">Solicitações registradas neste período: <strong>${allPeriod.length}</strong></p>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="num" style="color:var(--bad)">${naoResPer.length}</div><div class="lbl">Não resolvidas</div></div>
      <div class="stat-box"><div class="num" style="color:var(--ok)">${conPer.length}</div><div class="lbl">Concluídas</div></div>
      <div class="stat-box"><div class="num" style="color:${taxaRes>=80?'var(--ok)':'var(--bad)'};">${taxaRes}%</div><div class="lbl">Taxa de resolução</div></div>
      <div class="stat-box"><div class="num">${allPeriod.length}</div><div class="lbl">Total no período</div></div>
    </div>`;

  // Breakdown por prioridade no período
  const altaPer=allPeriod.filter(r=>r.prio==='alta');
  const altaConPer=altaPer.filter(r=>r.status==='concluida');
  const normPer=allPeriod.filter(r=>r.prio!=='alta');
  const normConPer=normPer.filter(r=>r.status==='concluida');
  html+=`
    <div class="section-title">Por prioridade no período</div>
    <div class="turn-breakdown">
      <div class="turn-mini">
        <div class="tlabel" style="color:var(--bad);">Urgentes</div>
        <div class="mini-track"><div class="mini-fill ${altaPer.length&&Math.round(altaConPer.length/altaPer.length*100)<95?'warn':''}" style="width:${altaPer.length?Math.round(altaConPer.length/altaPer.length*100):0}%"></div></div>
        <div class="tpct">${altaConPer.length} concluídas de ${altaPer.length} — ${altaPer.length?Math.round(altaConPer.length/altaPer.length*100):0}%</div>
      </div>
      <div class="turn-mini">
        <div class="tlabel" style="color:var(--text-dim);">Prioridade normal</div>
        <div class="mini-track"><div class="mini-fill" style="width:${normPer.length?Math.round(normConPer.length/normPer.length*100):0}%"></div></div>
        <div class="tpct">${normConPer.length} concluídas de ${normPer.length} — ${normPer.length?Math.round(normConPer.length/normPer.length*100):0}%</div>
      </div>
    </div>`;

  // Tabela do período: concluídas primeiro, depois pendentes
  if(allPeriod.length){
    const conOrdenadas=conPer.sort((a,b)=>(b.closedAt||0)-(a.closedAt||0));
    const naoResOrdenadas=naoResPer.sort((a,b)=>a.createdAt-b.createdAt);
    html+=`<div class="section-title">Atendidos no período (${conPer.length})</div>`;
    if(conOrdenadas.length){
      html+=tableHead+conOrdenadas.map(reqRow).join('')+`</tbody></table></div>`;
    } else {
      html+=`<div class="empty-state">Nenhuma solicitação concluída neste período.</div>`;
    }
    html+=`<div class="section-title" style="margin-top:18px;">Não resolvidos no período (${naoResPer.length})</div>`;
    if(naoResOrdenadas.length){
      html+=tableHead+naoResOrdenadas.map(reqRow).join('')+`</tbody></table></div>`;
    } else {
      html+=`<div class="empty-state">Todos os chamados do período foram resolvidos 🎉</div>`;
    }
  } else {
    html+=`<div class="empty-state">Nenhuma solicitação registrada no período selecionado.</div>`;
  }

  html+=`<div id="reqFilterResults"></div>`;

  content.innerHTML=html;

  // Wire filters
  document.getElementById('reqFilterApply')?.addEventListener('click', ()=>{
    const fMonth = document.getElementById('reqFilterMonth').value;
    const fTipo  = document.getElementById('reqFilterTipo').value;
    const fPrio  = document.getElementById('reqFilterPrio').value;

    // Se nenhum filtro selecionado, não faz nada
    if(!fMonth && !fTipo && !fPrio) return;

    let filtered = all;
    if(fMonth){ const [y,mo]=fMonth.split('-'); filtered=filtered.filter(r=>{ const d=new Date(r.createdAt); return d.getFullYear()==y&&(d.getMonth()+1)==mo; }); }
    if(fTipo)  filtered=filtered.filter(r=>(r.tipo||'Não informado')===fTipo);
    if(fPrio)  filtered=filtered.filter(r=>r.prio===fPrio);

    const conF=filtered.filter(r=>r.status==='concluida');
    const aberF=filtered.filter(r=>r.status==='aberta');
    const andF=filtered.filter(r=>r.status==='andamento');
    const slaF=calcSla(conF);
    const txF=filtered.length?Math.round(conF.length/filtered.length*100):0;

    // Breakdown por tipo
    const tiposF={};
    filtered.forEach(r=>{ const t=r.tipo||'Não informado'; tiposF[t]=(tiposF[t]||0)+1; });
    const tipoBreakdown=Object.entries(tiposF).sort((a,b)=>b[1]-a[1]).map(([tipo,qtd])=>{
      const pct=filtered.length?Math.round(qtd/filtered.length*100):0;
      const conTipo=conF.filter(r=>(r.tipo||'Não informado')===tipo).length;
      return `<div class="stat-box">
        <div class="num" style="font-size:20px;color:var(--teal-bright);">${qtd}</div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:4px;font-weight:600;">${tipo}</div>
        <div style="font-size:11px;color:var(--ok);margin-top:2px;">${conTipo} concluídas</div>
        <div style="margin-top:6px;height:4px;background:var(--panel-2);border-radius:3px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:var(--teal);border-radius:3px;"></div>
        </div>
        <div style="font-size:10px;color:var(--text-dim);margin-top:3px;">${pct}% do filtro</div>
      </div>`;
    }).join('');

    // Descrição dos filtros ativos
    const filtrosAtivos = [
      fMonth ? `Mês: ${fMonth}` : '',
      fTipo  ? `Tipo: ${fTipo}` : '',
      fPrio  ? `Prioridade: ${fPrio==='alta'?'Urgente':'Normal'}` : '',
    ].filter(Boolean).join(' · ');

    // Substituir TODA a tela com o resultado filtrado
    content.innerHTML=`
      <!-- Barra de filtros ativa -->
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;background:var(--panel);border:1px solid var(--teal);border-radius:10px;padding:14px 18px;">
        <div style="font-size:13px;color:var(--teal-bright);font-weight:600;">🔍 Filtro ativo:</div>
        <div style="font-size:13px;color:var(--text);">${filtrosAtivos}</div>
        <button id="reqFilterClearResult" class="btn secondary" style="margin-left:auto;">✕ Limpar filtro</button>
      </div>

      <!-- KPIs do filtro -->
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${filtered.length}</div><div class="lbl">Total</div></div>
        <div class="stat-box"><div class="num" style="color:var(--amber)">${aberF.length+andF.length}</div><div class="lbl">Não resolvidas</div></div>
        <div class="stat-box"><div class="num" style="color:var(--ok)">${conF.length}</div><div class="lbl">Concluídas</div></div>
        <div class="stat-box"><div class="num" style="color:${txF>=80?'var(--ok)':'var(--bad)'};">${txF}%</div><div class="lbl">Taxa resolução</div></div>
        <div class="stat-box"><div class="num" style="color:var(--teal-bright)">${slaF||'—'}</div><div class="lbl">SLA médio</div></div>
      </div>

      <!-- Breakdown por tipo (só se houver mais de 1) -->
      ${Object.keys(tiposF).length>1?`<div class="section-title">Por tipo de ocorrência</div><div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">${tipoBreakdown}</div>`:''}

      <!-- Tabela de chamados -->
      <div class="section-title">Chamados (${filtered.length})</div>
      ${filtered.length
        ? tableHead+filtered.sort((a,b)=>b.createdAt-a.createdAt).map(reqRow).join('')+'</tbody></table></div>'
        : '<div class="empty-state">Nenhum resultado para os filtros selecionados.</div>'
      }
    `;

    // Botão limpar volta para a tela completa
    document.getElementById('reqFilterClearResult')?.addEventListener('click', ()=>{
      renderReportRequests(content);
    });
  });
}
